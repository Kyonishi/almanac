<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>萬年曆</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#B03A2E">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>
<script src="calendar-lexicon.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#B03A2E;--dred:#8B1A1A;
  --grn:#2E7D32;--lgrn:#EBF5EB;
  --txt:#2C2C2C;--sub:#8A8A8A;--brd:#EBEBEB;--bg:#F4F2ED;
  --gold:#B8860B;--lgold:#FFF8E1;
  --card:#fff;--txt2:#555;--txt3:#AAA;--line2:#DDD;
  --shadow-1:rgba(0,0,0,.09);--shadow-2:rgba(0,0,0,.18);--shadow-3:rgba(0,0,0,.3);
  --content-w:480px; /* 手機寬度，下面桌面斷點會加寬；.sheet 也吃這個變數，改這裡就同步 */
}
/* 桌面/平板寬螢幕開啟時加寬欄位，不改多欄式排版，理由同 qimen.html(2026-08-30) */
@media (min-width:768px){ :root{ --content-w:700px; } }
/* 深色模式：跟隨系統設定，只重定義結構性顏色的變數；帶色底的小卡片(宜忌標籤/值神卡等)
   維持原色調但整體調暗調飽和，避免在深色背景上刺眼 */
@media (prefers-color-scheme:dark){
  :root{
    --txt:#E8E6E1;--sub:#9A9A9A;--brd:#333;--bg:#1A1A1A;
    --card:#242424;--txt2:#B8B8B8;--txt3:#777;--line2:#444;
    --shadow-1:rgba(0,0,0,.4);--shadow-2:rgba(0,0,0,.5);--shadow-3:rgba(0,0,0,.6);
  }
  .bc,.bj,.bf,.bx,.tag,.jsc,.gc,.exp.good,.exp.bad,.exp.neu,.shbox,.caltext,.sc,
  .dh,.deity-sec,.tablet,.lp,.qbtn,.fd-row{ filter:brightness(.38) saturate(1.4); }
  .nb:hover{background:#3A2C2C}
  .d:not(.oth):hover{background:#332828}
}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  background:var(--bg);max-width:var(--content-w);margin:0 auto;min-height:100vh}

header{background:linear-gradient(160deg,var(--red) 0%,var(--dred) 100%);color:#fff;
  padding:18px 16px 13px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.h-title{font-size:20px;font-weight:700;letter-spacing:5px}
.h-date{font-size:10px;opacity:.75;text-align:right;line-height:1.7}

.mnav{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--card);border-bottom:1px solid var(--brd)}
.nb{background:none;border:none;color:var(--red);font-size:24px;width:36px;height:36px;
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s}
.nb:hover{background:#FEF0EF}
.mc{display:flex;align-items:center;gap:10px}
#ml{font-size:16px;font-weight:600;color:var(--txt)}
.tb{background:var(--red);color:#fff;border:none;border-radius:12px;padding:3px 11px;font-size:11px;cursor:pointer}

.qbar{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--brd)}
.qbtn{flex:1;background:#F0F7F0;color:var(--grn);border:1px solid #C8E6C9;border-radius:10px;
  padding:9px 6px;font-size:12.5px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px}
.qbtn:active{opacity:.8}
.fd-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;
  background:#F7FAF7;border-radius:8px;cursor:pointer}
.fd-row:hover{background:#EFF7EF}

.cal{background:var(--card);padding-bottom:10px;border-bottom:1px solid var(--brd)}
.wh{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 6px 4px;text-align:center}
.wh>span{font-size:11px;color:var(--sub);font-weight:500}
.wh>span:first-child{color:#C0392B}.wh>span:last-child{color:#2471A3}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 6px}
.d{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:3px 1px;border-radius:9px;cursor:pointer;min-height:50px;transition:background .1s}
.d:not(.oth):hover{background:#FEF5F5}.d.oth{opacity:.2;pointer-events:none}
.d:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.d.sel{background:var(--red)!important}
.sol{font-size:19px;font-weight:600;color:var(--txt);line-height:1}
.d.sun .sol{color:#C0392B}.d.sat .sol{color:#2471A3}
.d.sel .sol{color:#fff!important}.d.tod:not(.sel) .sol{color:var(--red);font-weight:800}
.lun{font-size:9px;color:var(--sub);margin-top:2px;line-height:1}.d.sel .lun{color:rgba(255,255,255,.8)}
.jqt{font-size:9px;color:var(--grn);font-weight:700;margin-top:2px}.d.sel .jqt{color:#81C784}
.dot{width:4px;height:4px;border-radius:50%;background:var(--red);margin:2px auto 0}.d.sel .dot{background:#fff}
.ddot{width:4px;height:4px;border-radius:50%;background:var(--gold);margin:1px auto 0}.d.sel .ddot{background:#FFD54F}

.det{margin:12px 8px 24px;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px var(--shadow-1)}

.dh{background:var(--lgrn);padding:18px 16px;display:flex;gap:14px;align-items:flex-start}
.bigd{font-size:72px;font-weight:900;color:var(--grn);line-height:1;min-width:80px;text-align:center;flex-shrink:0}
.dmeta{flex:1;padding-top:2px}
.dlun{font-size:22px;font-weight:700;color:var(--grn);line-height:1;margin-bottom:6px}
.dgz{font-size:11px;color:var(--txt2);line-height:1.75}
.bdg{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.bc{background:#FFF0E0;color:#C0622B;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:500}
.bj{background:#E8F5E9;color:var(--grn);padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600}
.bf{background:#FEF9E7;color:#B7770D;padding:2px 9px;border-radius:10px;font-size:10px}
.bx{background:#FDE8E8;color:#C0392B;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600}

.sec{padding:13px 16px;border-top:1px solid var(--brd)}
.st{font-size:9.5px;color:var(--txt3);letter-spacing:1.5px;font-weight:600;margin-bottom:11px}

.yjr{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}.yjr:last-child{margin-bottom:0}
.yjb{width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.yb{background:var(--grn)}.jb{background:var(--red)}
.yt{font-size:12.5px;color:#1A5E1A;line-height:1.85;flex:1}
.jt{font-size:12.5px;color:#B71C1C;line-height:1.85;flex:1}

.deity-sec{background:linear-gradient(to bottom,#FFFDE7,#FFF8E1)}
.deity-tablets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.tablet{flex:1;min-width:calc(50% - 4px);max-width:calc(50% - 4px);cursor:pointer;
  background:linear-gradient(to bottom,#FFFBF0,#FFF3CC);
  border:1px solid #D4A00A;border-top:4px solid var(--gold);
  border-radius:3px 3px 10px 10px;padding:10px 8px;text-align:center}
.tablet-icon{font-size:16px;margin-bottom:3px}
.tablet-name{font-size:13px;font-weight:700;color:#7B3F00;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;border:1px solid}
.tag.grn{background:#F0F7F0;color:var(--grn);border-color:#C8E6C9}
.tag.gld{background:#FFF8E1;color:var(--gold);border-color:#FFE082}
.tag.red{background:#FEF0F0;color:#C0392B;border-color:#F5C6C6}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exp{border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer}
.exp:active{opacity:.85}
.exp.good{background:#E8F5E9;border:1.5px solid #A5D6A7}
.exp.bad{background:#FFEBEE;border:1.5px solid #EF9A9A}
.exp.neu{background:#F5F5F5;border:1.5px solid #E0E0E0}
.exp-lbl{font-size:10px;color:#AAA;font-weight:500;margin-bottom:4px}
.exp-nm{font-size:28px;font-weight:900;line-height:1;margin-bottom:5px}
.exp.good .exp-nm{color:var(--grn)}.exp.bad .exp-nm{color:var(--red)}.exp.neu .exp-nm{color:#555}
.lp{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700;margin-bottom:6px}
.exp.good .lp{background:var(--grn);color:#fff}.exp.bad .lp{background:var(--red);color:#fff}.exp.neu .lp{background:#888;color:#fff}
.exp-desc{font-size:10.5px;color:#666;line-height:1.6}

.jsw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jsc{background:#F7FAF7;border-radius:9px;padding:9px 10px}
.jsc.bad{background:#FEF5F5}
.jst{font-size:10px;font-weight:700;margin-bottom:6px;color:var(--grn)}
.jsc.bad .jst{color:var(--red)}
.jsi{font-size:11px;color:#555;line-height:1.9}
.jsc.bad .jsi{color:#B71C1C}

.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gc{background:#F7FAF7;border-radius:9px;padding:9px 4px;text-align:center}
.gl{font-size:9px;color:#AAA;margin-bottom:4px;font-weight:500}
.gv{font-size:12.5px;color:var(--grn);font-weight:700}
.gvl{font-size:14px;color:var(--grn);font-weight:700}

.caltext{font-size:13px;color:#4A5A4A;line-height:1.85;background:#F7FAF7;border-radius:9px;padding:11px 13px}
.caltext strong{color:var(--grn)}

.jqrow{display:flex;justify-content:space-between;margin-bottom:7px}
.jqp{font-size:13px;font-weight:700;color:var(--grn)}.jqn{font-size:13px;font-weight:700;color:#D67D00}
.jqbar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.jqfill{height:100%;background:linear-gradient(to right,var(--grn),#D67D00);border-radius:3px}
.jqinfo{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--txt3)}

.shbox{background:#F7FAF7;border-radius:9px;padding:11px 13px}
.shcur{font-size:13px;color:var(--grn);font-weight:700;margin-bottom:7px}
.shg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sc{text-align:center;font-size:9px;color:#AAA;background:#EEF5EE;border-radius:5px;padding:3px 1px;line-height:1.4}
.sc.now{background:var(--grn);color:#fff}
.sc .hz{font-size:11px;font-weight:700}


/* cross-nav */
.cross-nav{
  position:fixed;bottom:20px;
  right:max(16px, calc((100vw - var(--content-w)) / 2 + 16px));
  z-index:999;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end
}
.cross-nav a{
  display:flex;align-items:center;gap:8px;
  background:rgba(26,26,46,.92);color:#E8D5A3;
  border-radius:24px;padding:8px 14px 8px 10px;
  text-decoration:none;font-size:12px;letter-spacing:1px;
  box-shadow:0 2px 10px rgba(0,0,0,.3);backdrop-filter:blur(4px);
  transition:transform .15s,opacity .15s;
}
.cross-nav a:hover{opacity:.88;transform:scale(1.04)}
.cross-nav a .nav-icon{font-size:16px}
footer{text-align:center;font-size:10px;color:var(--txt3);padding:12px 16px 20px;letter-spacing:.5px}

/* ── clickable terms ── */
.term{cursor:pointer;border-bottom:1px dotted currentColor;padding-bottom:1px}
.term:active{opacity:.6}

/* ── bottom sheet ── */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;
  opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:var(--content-w);margin:0 auto;
  background:var(--card);border-radius:18px 18px 0 0;z-index:91;
  padding:8px 20px 28px;transform:translateY(100%);transition:transform .25s ease;
  box-shadow:0 -6px 24px var(--shadow-2)}
.sheet.show{transform:translateY(0)}
.sheet-bar{width:36px;height:4px;background:var(--line2);border-radius:2px;margin:6px auto 14px}
.sheet-term{font-size:20px;font-weight:800;color:var(--grn);margin-bottom:8px}
.sheet-desc{font-size:14px;color:var(--txt2);line-height:1.8}
</style>
</head>
<body>

<header>
  <div class="h-title">萬 年 曆</div>
  <div class="h-date" id="hdate"></div>
</header>

<div class="mnav">
  <button class="nb" onclick="cm(-1)">‹</button>
  <div class="mc"><span id="ml" class="term" onclick="openJump()"></span><button class="tb" onclick="gt()">今天</button></div>
  <button class="nb" onclick="cm(1)">›</button>
</div>

<div class="qbar">
  <button class="qbtn" onclick="openFindDay()">🔍 找吉日</button>
  <button class="qbtn" onclick="openBirthday()">🎂 農曆生日查詢</button>
</div>

<div class="cal">
  <div class="wh"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
  <div class="dg" id="dg"></div>
</div>

<div class="det" id="det">
  <div style="padding:36px;text-align:center;color:var(--txt3);font-size:14px">載入農曆資料中…</div>
</div>

<div class="sheet-mask" id="smask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-bar"></div>
  <div class="sheet-term" id="sterm"></div>
  <div class="sheet-desc" id="sdesc"></div>
</div>


<footer>lunar-javascript (6tail) · 無廣告 · 開源自用</footer>

<script>
!function(){
'use strict';
const T=new Date();
let CY=T.getFullYear(),CM=T.getMonth()+1,SY=CY,SM=CM,SD=T.getDate();
const s=(f,d='')=>{try{const r=f();return r==null?d:r}catch{return d}};

/* embed a string inside onclick="fn('...')" safely: escape both the JS
   string-literal delimiter and the surrounding HTML attribute delimiter */
function jsAttr(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}
/* escape free-text user input before dropping it into innerHTML (unlike jsAttr's targets,
   which are all trusted library/data-table strings, this one guards actual user typing) */
function escHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let curSheetTimer=null;
function term(txt){
  if(!txt) return '';
  const tt = t2(txt);
  return `<span class="term" onclick="openSheet('${jsAttr(txt)}')">${tt}</span>`;
}
function openSheet(rawTerm){
  const def = GLOSSARY[rawTerm];
  document.getElementById('sterm').textContent = t2(rawTerm);
  document.getElementById('sdesc').textContent = def ? t2(def) : '該術語說明尚未收錄，可自行查閱通書或黃曆資料。';
  document.getElementById('smask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
window.openSheet = openSheet;
function openDeitySheet(name, src){
  const label = src==='佛' ? '佛教節日' : '道教節日／民間信仰';
  const note = src==='佛'
    ? '此為佛教傳統紀念日，信眾常於此日持齋、誦經、禮佛，表達虔敬與祈福之意。'
    : '此為道教或民間信仰所奉祀神祇之聖誕／紀念日，信眾常於此日上香、祭祀、還願，表達敬意。';
  document.getElementById('sterm').textContent = t2(name);
  document.getElementById('sdesc').textContent = `〔${label}〕${note}　（注：具體典故各地廟宇傳承略有不同，此處僅作通用說明，詳情可諮詢當地宮廟。）`;
  document.getElementById('smask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
window.openDeitySheet = openDeitySheet;
function openJump(){
  const opts=Array.from({length:12},(_,i)=>`<option value="${i+1}"${i+1===CM?' selected':''}>${i+1}月</option>`).join('');
  document.getElementById('sterm').textContent='跳轉到';
  document.getElementById('sdesc').innerHTML=`
    <div style="display:flex;gap:10px;align-items:center">
      <input id="jyear" type="number" value="${CY}" min="1900" max="2100" onkeydown="if(event.key==='Enter')doJump()"
        style="width:90px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;font-size:15px;background:var(--card);color:var(--txt)">
      <span>年</span>
      <select id="jmonth" style="padding:8px 10px;border:1px solid var(--line2);border-radius:8px;font-size:15px;background:var(--card);color:var(--txt)">${opts}</select>
    </div>
    <button onclick="doJump()" style="margin-top:16px;width:100%;padding:11px;background:var(--red);
      color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer">前往</button>`;
  document.getElementById('smask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  setTimeout(()=>document.getElementById('jyear').focus(),200);
}
window.openJump = openJump;
window.doJump = function(){
  const y=parseInt(document.getElementById('jyear').value,10);
  const m=parseInt(document.getElementById('jmonth').value,10);
  if(!y||y<1900||y>2100||!m) return;
  CY=y;CM=m;rc();closeSheet();
};

/* 跳到查詢命中的某一天：同時切換月曆顯示的月份跟選取的日期 */
window.pickQueryDay=function(y,m,d){
  SY=y;SM=m;SD=d;CY=y;CM=m;rc();rd();closeSheet();
  setTimeout(()=>document.getElementById('det').scrollIntoView({behavior:'smooth'}),250);
};

/* ── 找吉日：在指定天數內，往後找哪幾天的「宜」清單裡有輸入的事項 ──
   純粹對 lunar-javascript 已經算好的逐日宜忌資料做篩選聚合，不是新增解讀邏輯 */
function openFindDay(){
  const acts=Array.from(new Set(Object.keys(GLOSSARY).map(t2))).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  document.getElementById('sterm').textContent='找吉日';
  document.getElementById('sdesc').innerHTML=`
    <div style="font-size:12.5px;color:var(--txt2);margin-bottom:10px">輸入事項，往後搜尋哪幾天的「宜」清單裡有它</div>
    <input id="fdAct" list="fdActList" placeholder="例如：嫁娶、開市、入宅"
      style="width:100%;padding:9px 10px;border:1px solid var(--line2);border-radius:8px;
      font-size:14px;background:var(--card);color:var(--txt)">
    <datalist id="fdActList">${acts.map(a=>`<option value="${jsAttr(a)}">`).join('')}</datalist>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
      <span style="font-size:13px;color:var(--txt2)">搜尋範圍</span>
      <select id="fdRange" style="padding:7px 10px;border:1px solid var(--line2);border-radius:8px;
        font-size:14px;background:var(--card);color:var(--txt)">
        <option value="30">未來30天</option>
        <option value="60">未來60天</option>
        <option value="90" selected>未來90天</option>
        <option value="180">未來180天</option>
      </select>
    </div>
    <button onclick="doFindDay()" style="margin-top:14px;width:100%;padding:11px;background:var(--red);
      color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer">開始查詢</button>
    <div id="fdResult"></div>`;
  document.getElementById('smask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  setTimeout(()=>document.getElementById('fdAct').focus(),200);
}
window.openFindDay=openFindDay;
window.doFindDay=function(){
  const term=document.getElementById('fdAct').value.trim();
  const range=parseInt(document.getElementById('fdRange').value,10);
  const out=document.getElementById('fdResult');
  if(!term){ out.innerHTML='<div style="color:var(--red);font-size:13px;margin-top:8px">請先輸入事項</div>'; return; }
  out.innerHTML='<div style="color:var(--txt3);font-size:13px;margin-top:8px">查詢中…</div>';
  const matches=[];
  for(let i=0;i<=range&&matches.length<30;i++){
    const d=new Date(T.getFullYear(),T.getMonth(),T.getDate()+i);
    const y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();
    const yiArr=s(()=>ll(y,m,dd).getDayYi(),[])||[];
    if(yiArr.some(x=>t2(x)===term)) matches.push({y,m,d:dd,dow:d.getDay()});
  }
  if(!matches.length){
    out.innerHTML=`<div style="color:var(--txt2);font-size:13px;margin-top:8px">${range}天內找不到宜「${escHtml(term)}」的日子，試試放寬範圍或換個事項。</div>`;
    return;
  }
  out.innerHTML=`<div style="color:var(--txt3);font-size:12px;margin-top:10px">找到 ${matches.length} 天：</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px;max-height:240px;overflow-y:auto">
    ${matches.map(mt=>`<div class="fd-row" onclick="pickQueryDay(${mt.y},${mt.m},${mt.d})">
        <span style="font-size:13px;color:var(--txt)">${mt.y}年${mt.m}月${mt.d}日</span>
        <span style="font-size:11px;color:var(--txt3)">星期${DW[mt.dow]}</span>
      </div>`).join('')}
    </div>`;
};

  const dayOpts=Array.from({length:30},(_,i)=>`<option value="${i+1}">${i+1}日</option>`).join('');

  document.getElementById('sdesc').innerHTML=`
    <div style="font-size:12.5px;color:var(--txt2);margin-bottom:10px">輸入農曆生日，查詢未來對應的國曆日期</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="bMonth" style="padding:7px 10px;border:1px solid var(--line2);border-radius:8px;
        font-size:14px;background:var(--card);color:var(--txt)">${monthOpts}</select>
      <select id="bDay" style="padding:7px 10px;border:1px solid var(--line2);border-radius:8px;
        font-size:14px;background:var(--card);color:var(--txt)">${dayOpts}</select>
      <label style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--txt2)">
        <input type="checkbox" id="bLeap"> 閏月
      </label>
    </div>
    <button onclick="doBirthday()" style="margin-top:14px;width:100%;padding:11px;background:var(--red);
      color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer">查詢未來幾次</button>
    <div id="bResult"></div>`;
  document.getElementById('smask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
window.openBirthday=openBirthday;
window.doBirthday=function(){
  const leap=document.getElementById('bLeap').checked;
  const m=parseInt(document.getElementById('bMonth').value,10);
  const d=parseInt(document.getElementById('bDay').value,10);
  const out=document.getElementById('bResult');
  const today=new Date(T.getFullYear(),T.getMonth(),T.getDate());
  const results=[];
  let y=T.getFullYear();
  for(let guard=0;guard<100&&results.length<3;guard++,y++){
    const solar=s(()=>Lunar.fromYmd(y,leap?-m:m,d).getSolar(),null);
    if(!solar) continue;
    const sd=new Date(solar.getYear(),solar.getMonth()-1,solar.getDay());
    if(sd>=today) results.push(solar);
  }
  if(!results.length){
    out.innerHTML='<div style="color:var(--txt2);font-size:13px;margin-top:8px">查無符合的日期，請確認閏月／日期是否存在。</div>';
    return;
  }
  out.innerHTML=`<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
    ${results.map(sol=>{
      const sd=new Date(sol.getYear(),sol.getMonth()-1,sol.getDay());
      const dow=sd.getDay();
      const daysAway=Math.round((sd-today)/864e5);
      return `<div class="fd-row" onclick="pickQueryDay(${sol.getYear()},${sol.getMonth()},${sol.getDay()})">
        <span style="font-size:13px;color:var(--txt)">${sol.getYear()}年${sol.getMonth()}月${sol.getDay()}日</span>
        <span style="font-size:11px;color:var(--txt3)">星期${DW[dow]}・${daysAway===0?'今天':daysAway+'天後'}</span>
      </div>`;
    }).join('')}
  </div>`;
};

window.closeSheet = function(){
  document.getElementById('smask').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
};

let t2 = x => x; // identity fallback until OpenCC loads

/* ══ HELPERS ══════════════════════════════════ */
const sl=(y,m,d)=>s(()=>Solar.fromYmd(y,m,d));
const ll=(y,m,d)=>s(()=>sl(y,m,d).getLunar());
const tao=(y,m,d)=>s(()=>Tao.fromLunar(ll(y,m,d)));
const foto=(y,m,d)=>s(()=>Foto.fromLunar(ll(y,m,d)));

function jqFor(y,m,d){
  return s(()=>{
    const tbl=ll(y,m,d).getJieQiTable();
    return Object.keys(tbl).find(k=>{const x=tbl[k];return x.getYear()===y&&x.getMonth()===m&&x.getDay()===d;})||'';
  },'');
}
/* general (non-deity) festivals: solar + lunar "other" days */
function genFesFor(y,m,d){
  const sf=s(()=>sl(y,m,d).getFestivals(),[]);
  const lf=s(()=>ll(y,m,d).getFestivals(),[]);
  const sof=s(()=>sl(y,m,d).getOtherFestivals(),[]);
  return [...(sf||[]),...(lf||[]),...(sof||[])];
}
/* deity birthdays: Tao (道教) + Foto (佛教) festival tables. Tag with source. */
function deityFesFor(y,m,d){
  const tf=s(()=>tao(y,m,d).getFestivals().map(f=>({name:f.getName(),src:'道'})),[]);
  const ff=s(()=>foto(y,m,d).getFestivals().map(f=>({name:f.getName(),src:'佛'})),[]);
  return [...(tf||[]),...(ff||[])];
}

function siIdx(){const h=new Date().getHours();return h===23?0:Math.floor((h+1)/2);}
const HZ=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const HT=['23–01','01–03','03–05','05–07','07–09','09–11','11–13','13–15','15–17','17–19','19–21','21–23'];
const DW='日一二三四五六';
const cc=lk=>lk==='吉'?'good':lk==='凶'?'bad':'neu';

/* ══ HEADER ═══════════════════════════════════ */
function updH(){
  const n=new Date(),hm=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  document.getElementById('hdate').innerHTML=`${n.getFullYear()}.${n.getMonth()+1}.${n.getDate()} 星期${DW[n.getDay()]}<br>${hm}`;
}
updH();setInterval(updH,30000);

/* ══ CALENDAR ═════════════════════════════════ */
function rc(){
  document.getElementById('ml').textContent=`${CY}年${String(CM).padStart(2,'0')}月`;
  const g=document.getElementById('dg');g.innerHTML='';
  const fd=new Date(CY,CM-1,1),dow=fd.getDay(),dim=new Date(CY,CM,0).getDate();
  const pM=CM===1?12:CM-1,pY=CM===1?CY-1:CY,pdim=new Date(pY,pM,0).getDate();
  const nM=CM===12?1:CM+1,nY=CM===12?CY+1:CY;
  for(let i=dow-1;i>=0;i--) g.appendChild(mc(pY,pM,pdim-i,true));
  for(let d=1;d<=dim;d++)   g.appendChild(mc(CY,CM,d,false));
  const tot=dow+dim,tail=tot%7?7-tot%7:0;
  for(let d=1;d<=tail;d++)  g.appendChild(mc(nY,nM,d,true));
}

function mc(y,m,d,oth){
  const isT=!oth&&y===T.getFullYear()&&m===(T.getMonth()+1)&&d===T.getDate();
  const isS=!oth&&y===SY&&m===SM&&d===SD;
  const dw=new Date(y,m-1,d).getDay();
  const el=document.createElement('div');
  el.className='d'+(oth?' oth':'')+(isS?' sel':'')+(isT?' tod':'')+(dw===0?' sun':dw===6?' sat':'');
  const sv=document.createElement('div');sv.className='sol';sv.textContent=d;el.appendChild(sv);
  if(!oth){
    const lun=ll(y,m,d),jq=jqFor(y,m,d);
    const gf=genFesFor(y,m,d),df=deityFesFor(y,m,d);
    const fv=(df[0]&&df[0].name)||gf[0]||'';
    const sub=document.createElement('div');
    if(jq){sub.className='jqt';sub.textContent=t2(jq);}
    else if(fv){sub.className='lun';sub.style.color='#C07A00';
      const tf=t2(fv);sub.textContent=tf.length>4?tf.slice(0,4):tf;}
    else if(lun){sub.className='lun';
      if(lun.getDay()===1){sub.textContent=t2(lun.getMonthInChinese())+'月';sub.style.fontWeight='700';sub.style.color='var(--txt2)';}
      else sub.textContent=t2(lun.getDayInChinese());}
    el.appendChild(sub);
    if(df.length){const dot=document.createElement('div');dot.className='ddot';el.appendChild(dot);}
    if(isT&&!isS){const dot=document.createElement('div');dot.className='dot';el.appendChild(dot);}
    const pick=()=>{SY=y;SM=m;SD=d;rc();rd();setTimeout(()=>document.getElementById('det').scrollIntoView({behavior:'smooth'}),50);};
    el.onclick=pick;
    el.tabIndex=0;
    el.setAttribute('role','button');
    el.setAttribute('aria-label',`${y}年${m}月${d}日`+(isS?'（已選取）':''));
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}};
  }
  return el;
}

  const g=(f,d='')=>s(f,d);

  const yi   =g(()=>lun.getDayYi(),[]);
  const ji   =g(()=>lun.getDayJi(),[]);
  const pc   =g(()=>lun.getDayPositionCai());
  const pf   =g(()=>lun.getDayPositionFu());

  /* 节气 progress */

      new Date(a.getYear(),a.getMonth()-1,a.getDay())-new Date(b.getYear(),b.getMonth()-1,b.getDay()));
    let pN='',nN='',pD=0,nD=0;
    for(const[n,x]of sorted){
      const xd=new Date(x.getYear(),x.getMonth()-1,x.getDay());
      if(xd<=sel){pN=n;pD=Math.round((sel-xd)/864e5);}else if(!nN){nN=n;nD=Math.round((xd-sel)/864e5);}
    }
    if(pN&&nN){const tot=pD+nD||1,pct=Math.min(100,Math.round(pD/tot*100));
      jqHtml=`<div class="sec"><div class="st">節　氣</div>
        <div class="jqrow"><span class="jqp">${t2(pN)}</span><span class="jqn">${t2(nN)}</span></div>

        <div class="jqinfo"><span>已過 ${pD} 天</span><span>還有 ${nD} 天</span></div>
      </div>`;

  const T2=x=>t2(x); // shorthand
  const ys=(Array.isArray(yi)?yi:[]).map(term).join('　');

      <div class="bdg">

        ${xuLk==='凶'?'<span class="bx">凶日</span>':xuLk==='吉'?'<span class="bj">吉日</span>':''}
        ${jq?`<span class="bj">🌿 ${T2(jq)}</span>`:''}
        ${genFes.map(f=>`<span class="bf">🎊 ${T2(f)}</span>`).join('')}

      ${deityFes.map(f=>`
      <div class="tablet" onclick="openDeitySheet('${jsAttr(f.name)}','${jsAttr(f.src)}')">
        <div class="tablet-icon">${f.src==='佛'?'🪷':'⛩'}</div>
        <div class="tablet-name">${T2(f.name)}</div>
      </div>`).join('')}

  <!-- ⑥ 神煞概覽 -->
  <div class="sec">
    <div class="st">神　煞　概　覽</div>

      <div class="gc"><div class="gl">五行納音</div><div class="gv">${T2(ny)||'—'}</div></div>
