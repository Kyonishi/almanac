<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>奇門遁甲排盤</title>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1A1A2E;--red:#8B1A1A;--gold:#9A7B2A;--lgold:#FDF6E3;
  --grn:#2E5E2E;--lgrn:#EEF5EE;
  --bg:#F5F0E8;--card:#FFFDF7;--brd:#E2D9C8;--sub:#7A6A50;
  --content-w:500px;
}
@media (min-width:768px){ :root{ --content-w:720px; } }
html,body{min-height:100%;background:var(--bg);
  font-family:-apple-system,'PingFang TC','Noto Sans TC',serif}
body{max-width:var(--content-w);margin:0 auto;padding-bottom:32px}

/* HEADER */
header{
  background:linear-gradient(160deg,#1A1A2E 0%,#2C1810 100%);
  color:#E8D5A3;padding:18px 16px 14px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.3)}
.h-title{font-size:20px;font-weight:700;letter-spacing:6px}
.h-sub{font-size:10px;opacity:.65;text-align:right;line-height:1.7}

/* INPUT PANEL */
.input-panel{background:var(--card);border-bottom:1px solid var(--brd);padding:14px 16px}
.input-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.input-row:last-child{margin-bottom:0}
.input-label{font-size:11px;color:var(--sub);width:48px;flex-shrink:0;font-weight:600;letter-spacing:.5px}
.input-hint{font-size:11px;color:var(--sub);line-height:1.6;margin:-4px 0 10px;padding-left:56px}
.inp{flex:1;border:1px solid var(--brd);border-radius:8px;padding:7px 10px;
  font-size:14px;background:#FFFDF7;color:var(--ink);font-family:inherit}
.inp:focus{outline:none;border-color:var(--gold)}
.btn-now{background:var(--gold);color:#fff;border:none;border-radius:8px;
  padding:7px 14px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-now:hover{opacity:.88}
.btn-calc{
  width:100%;background:linear-gradient(135deg,var(--red),#5C1010);
  color:#E8D5A3;border:none;border-radius:10px;padding:12px;
  font-size:16px;letter-spacing:4px;cursor:pointer;font-family:inherit;
  margin-top:4px;box-shadow:0 2px 6px rgba(139,26,26,.35)
}
.btn-calc:hover{opacity:.9}
.btn-calc:active{transform:scale(.98)}
.btn-ritual{
  width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold);
  border-radius:8px;padding:8px;font-size:12px;letter-spacing:2px;cursor:pointer;
  font-family:inherit;margin-top:4px
}
.btn-ritual:hover{background:rgba(212,175,55,.1)}
.ritual-panel{
  margin-top:8px;padding:12px;background:#FAF6ED;border:1px solid var(--gold);
  border-radius:10px;font-size:12.5px;line-height:1.9;color:#3A2E1F
}
.ritual-panel .r-sec{margin-bottom:10px}
.ritual-panel .r-sec:last-child{margin-bottom:0}
.ritual-panel .r-title{font-weight:700;color:var(--red);margin-bottom:3px}
.ritual-panel .r-no{color:#B03030}
.ritual-panel .r-yes{color:#1565C0}
.ritual-panel .r-quote{font-style:italic;opacity:.9;padding:4px 8px;background:#fff;border-radius:6px;margin:3px 0}

.h-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;opacity:.85}
.h-btn{background:#fff;border:1px solid var(--gold);color:#3A2E1F;border-radius:6px;
  padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
.h-btn:hover{background:rgba(212,175,55,.15)}
.h-btn-danger{border-color:#B03030;color:#B03030}
.h-list{max-height:320px;overflow-y:auto}
.h-row{display:block;padding:8px 0;border-bottom:1px solid #EEE0BB}
.h-row:last-child{border-bottom:none}
.h-row-main{flex:1;cursor:pointer}
.h-row-main:hover{opacity:.7}
.h-row-date{font-weight:700}
.h-row-info{opacity:.8;font-size:11.5px}
.h-row-del{background:none;border:none;color:#B03030;cursor:pointer;font-size:14px;padding:4px}
.h-row-top{display:flex;align-items:flex-start;gap:6px}

/* RESULT */
.result{margin:10px 8px}

/* META CARD */
.meta-card{
  background:var(--card);border-radius:12px;padding:14px 16px;
  border:1px solid var(--brd);margin-bottom:10px;
  box-shadow:0 1px 6px rgba(0,0,0,.06)
}
.meta-title{font-size:10px;color:var(--sub);letter-spacing:1.5px;margin-bottom:10px;font-weight:600}
.meta-gz{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:2px;margin-bottom:8px}
.meta-ju{
  display:inline-block;background:var(--red);color:#E8D5A3;
  padding:3px 12px;border-radius:12px;font-size:13px;font-weight:600;
  letter-spacing:1px;margin-bottom:8px
}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.meta-item{background:#F8F4EC;border-radius:7px;padding:7px 10px}
.meta-k{font-size:9px;color:var(--sub);margin-bottom:2px;font-weight:600}
.meta-v{font-size:12px;color:var(--ink);font-weight:600;line-height:1.4}
.meta-v.zf{color:var(--grn)}.meta-v.zs{color:var(--red)}

/* 九宮格 */
.pan-wrap{background:var(--card);border-radius:12px;border:1px solid var(--brd);
  overflow:hidden;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.pan-header{
  background:linear-gradient(135deg,#1A1A2E,#2C1810);color:#E8D5A3;
  padding:9px 14px;font-size:11px;letter-spacing:2px;font-weight:600
}
.pan-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-left:1px solid var(--brd);border-top:1px solid var(--brd);
}
.cell{
  border-right:1px solid var(--brd);border-bottom:1px solid var(--brd);
  padding:10px 6px 22px;min-height:138px;position:relative;
  display:flex;flex-direction:column;align-items:stretch;justify-content:center;
  gap:2px;
  background:var(--card);
}
.cell.center-cell{background:#FDFAF2}
.cell.is-zf{background:#EEF7EE}  /* 值符所在宮 */
.cell.is-zs{background:#FEF3F3}  /* 值使所在宮 */
.cell-gua{
  position:absolute;right:6px;bottom:4px;
  font-size:9px;color:var(--ink);opacity:.55;font-weight:600;letter-spacing:.5px;
}
.cell-gua.kongwang{color:#2E6FD9;opacity:1;font-weight:700}
.cell-dir{
  position:absolute;left:6px;top:4px;
  font-size:9px;color:var(--ink);opacity:.4;font-weight:600;letter-spacing:1px;
}
.c-line{display:flex;align-items:baseline;justify-content:center;gap:6px;min-height:22px}
.c-sky{
  font-size:22px;font-weight:900;color:var(--ink);line-height:1;
}
.c-sky.dim{color:var(--ink);opacity:.4;font-weight:400;font-size:16px}
.c-earth{
  font-size:14px;font-weight:700;color:var(--ink);opacity:.75;line-height:1;
}
.c-god-val,.c-star-val{
  font-size:12px;font-weight:700;color:var(--ink);opacity:.85;letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:3px;line-height:1.3;
}
.c-door-line{display:flex;justify-content:center;margin:3px 0}
.c-door-val{
  font-size:14px;font-weight:800;color:var(--ink);letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:3px;line-height:1;
}
/* 空亡標記 (跟 cell-gua.kongwang 同色系, 都是藍) — 排盤事實(哪個宮空亡)，不是吉凶判斷 */
.c-kong{
  position:absolute;top:4px;right:4px;
  font-size:8px;color:#2E6FD9;background:#EAF1FC;
  border-radius:3px;padding:1px 3px;font-weight:700
}
/* 值符/值使標籤 */
.c-special{
  font-size:8px;font-weight:700;border-radius:3px;padding:1px 4px;
  margin-top:2px;align-self:center;
}
.c-special.zf-tag{background:var(--grn);color:#fff}
.c-special.zs-tag{background:var(--red);color:#fff}

/* cross-nav */
.cross-nav{
  position:fixed;bottom:20px;
  right:max(16px, calc((100vw - var(--content-w)) / 2 + 16px));
  z-index:999;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end
}
.cross-nav a{
  display:flex;align-items:center;gap:8px;
  background:rgba(26,26,46,.8);color:#E8D5A3;
  border-radius:24px;padding:7px 12px 7px 9px;
  text-decoration:none;font-size:11px;letter-spacing:1px;
  box-shadow:0 2px 10px rgba(0,0,0,.25);backdrop-filter:blur(4px);
  transition:transform .15s,opacity .15s;
}
.cross-nav a:hover{opacity:1;transform:scale(1.04)}
.cross-nav a .nav-icon{font-size:14px}
.cross-nav a.top-btn{
  width:34px;height:34px;padding:0;border-radius:50%;justify-content:center;
  opacity:0;pointer-events:none;transform:translateY(6px);
}
.cross-nav a.top-btn.show{opacity:.85;pointer-events:auto;transform:translateY(0)}
.cross-nav a.top-btn:hover{opacity:1}

footer{text-align:center;font-size:10px;color:var(--sub);padding:16px;letter-spacing:.5px}

/* empty state */
.empty{
  text-align:center;padding:48px 20px;color:var(--sub);
  font-size:14px;line-height:2;letter-spacing:1px
}
.empty .big{font-size:32px;margin-bottom:8px}
</style>
</head>
<body>

<header>
  <div class="h-title">奇門遁甲</div>
  <div class="h-sub" id="hdate"></div>
</header>

<div class="input-panel">
  <div class="input-row">
    <div class="input-label">日期</div>
    <input class="inp" type="date" id="iDate">
    <button class="btn-now" onclick="setNow()">現在</button>
  </div>
  <div class="input-row">
    <div class="input-label">時間</div>
    <input class="inp" type="time" id="iTime">
  </div>
  <div class="input-row">
    <div class="input-label">地點</div>
    <select class="inp" id="iCityPreset" onchange="applyCityPreset()">
      <option value="">（可選：挑城市快速帶入經度，下方也可以手動輸入更精確的值）</option>
    </select>
  </div>
  <div class="input-row">
    <div class="input-label">經度</div>
    <input class="inp" type="number" id="iLongitude" step="0.01" placeholder="留空＝不校正" value="104.06">
  </div>
  <div class="input-hint">真太陽時校正用：東經為正(西經填負數，如紐約-74.01)，成都約104.06(預設)。
    留空則完全不校正。</div>
  <button class="btn-ritual" onclick="toggleRitual()" type="button">☯ 起局須知 / 起局儀式</button>
  <div class="ritual-panel" id="ritualPanel" style="display:none"></div>
  <button class="btn-ritual" onclick="toggleHistory()" type="button">🕘 起局歷史記錄</button>
  <div class="ritual-panel" id="historyPanel" style="display:none"></div>
  <button class="btn-calc" onclick="calc()">起　局</button>
</div>

<div class="result" id="result">
  <div class="empty">
    <div class="big">☯</div>
    輸入時間後點「起局」<br>即可起一局時家奇門<br>
    <span style="font-size:11px;opacity:.7">拆補法 · 時家轉盤</span>
  </div>
</div>

<footer>時家奇門遁甲 · 拆補法 · lunar-javascript (6tail) · 無廣告</footer>

<script src="qimen-engine.js"></script>
<script src="qimen-lexicon.js"></script>
<script src="qimen-ui.js"></script>

<div class="cross-nav">
  <a href="#" id="backToTopBtn" class="top-btn" aria-label="回頂部"><span class="nav-icon">⬆</span></a>
  <a href="index.html">
    <span class="nav-icon">📅</span>萬年曆
  </a>
</div>
<script>
(function(){
  var btn=document.getElementById('backToTopBtn');
  if(!btn)return;
  window.addEventListener('scroll',function(){
    btn.classList.toggle('show', window.scrollY>500);
  },{passive:true});
  btn.addEventListener('click',function(e){
    e.preventDefault();
    window.scrollTo({top:0,behavior:'smooth'});
  });
})();
</script>
</body>
</html>
