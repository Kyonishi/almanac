<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>奇門遁甲排盤</title>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1A1A2E;--red:#8B1A1A;--gold:#9A7B2A;--lgold:#FDF6E3;
  --grn:#2E5E2E;--lgrn:#EEF5EE;
  --bg:#F5F0E8;--card:#FFFDF7;--brd:#E2D9C8;--sub:#7A6A50;
}
html,body{min-height:100%;background:var(--bg);
  font-family:-apple-system,'PingFang TC','Noto Sans TC',serif}
body{max-width:500px;margin:0 auto;padding-bottom:32px}

/* HEADER */
header{
  background:linear-gradient(160deg,#1A1A2E 0%,#2C1810 100%);
  color:#E8D5A3;padding:18px 16px 14px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.3)}
.h-title{font-size:20px;font-weight:700;letter-spacing:6px}
.h-sub{font-size:10px;opacity:.65;text-align:right;line-height:1.7}

/* INPUT PANEL */
.input-panel{background:var(--card);border-bottom:1px solid var(--brd);padding:14px 16px}
.input-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.input-row:last-child{margin-bottom:0}
.input-label{font-size:11px;color:var(--sub);width:48px;flex-shrink:0;font-weight:600;letter-spacing:.5px}
.inp{flex:1;border:1px solid var(--brd);border-radius:8px;padding:7px 10px;
  font-size:14px;background:#FFFDF7;color:var(--ink);font-family:inherit}
.inp:focus{outline:none;border-color:var(--gold)}
.btn-now{background:var(--gold);color:#fff;border:none;border-radius:8px;
  padding:7px 14px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-now:hover{opacity:.88}
.btn-calc{
  width:100%;background:linear-gradient(135deg,var(--red),#5C1010);
  color:#E8D5A3;border:none;border-radius:10px;padding:12px;
  font-size:16px;letter-spacing:4px;cursor:pointer;font-family:inherit;
  margin-top:4px;box-shadow:0 2px 6px rgba(139,26,26,.35)
}
.btn-calc:hover{opacity:.9}
.btn-calc:active{transform:scale(.98)}
.btn-ritual{
  width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold);
  border-radius:8px;padding:8px;font-size:12px;letter-spacing:2px;cursor:pointer;
  font-family:inherit;margin-top:4px
}
.btn-ritual:hover{background:rgba(212,175,55,.1)}
.ritual-panel{
  margin-top:8px;padding:12px;background:#FAF6ED;border:1px solid var(--gold);
  border-radius:10px;font-size:12.5px;line-height:1.9;color:#3A2E1F
}
.ritual-panel .r-sec{margin-bottom:10px}
.ritual-panel .r-sec:last-child{margin-bottom:0}
.ritual-panel .r-title{font-weight:700;color:var(--red);margin-bottom:3px}
.ritual-panel .r-no{color:#B03030}
.ritual-panel .r-yes{color:#1565C0}
.ritual-panel .r-quote{font-style:italic;opacity:.9;padding:4px 8px;background:#fff;border-radius:6px;margin:3px 0}

.h-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;opacity:.85}
.h-btn{background:#fff;border:1px solid var(--gold);color:#3A2E1F;border-radius:6px;
  padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
.h-btn:hover{background:rgba(212,175,55,.15)}
.h-btn-danger{border-color:#B03030;color:#B03030}
.h-list{max-height:320px;overflow-y:auto}
.h-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #EEE0BB}
.h-row:last-child{border-bottom:none}
.h-row-main{flex:1;cursor:pointer}
.h-row-main:hover{opacity:.7}
.h-row-date{font-weight:700}
.h-row-info{opacity:.8;font-size:11.5px}
.h-row-hits{font-size:11px;color:var(--red);margin-top:2px}
.h-row-del{background:none;border:none;color:#B03030;cursor:pointer;font-size:14px;padding:4px}
.h-row-top{display:flex;align-items:flex-start;gap:6px}
.h-badge{font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;font-weight:700}
.h-badge-done{background:#E3F2E3;color:#2E7D32}
.h-badge-todo{background:#F0F0F0;color:#999}
.h-review{margin-top:6px}
.h-review-input{width:100%;min-height:44px;box-sizing:border-box;border:1px solid #DDD;border-radius:6px;
  padding:6px 8px;font-size:12px;font-family:inherit;resize:vertical;margin-bottom:4px}
.h-review-input:focus{outline:none;border-color:var(--gold)}

/* RESULT */
.result{margin:10px 8px}

/* META CARD */
.meta-card{
  background:var(--card);border-radius:12px;padding:14px 16px;
  border:1px solid var(--brd);margin-bottom:10px;
  box-shadow:0 1px 6px rgba(0,0,0,.06)
}
.meta-title{font-size:10px;color:var(--sub);letter-spacing:1.5px;margin-bottom:10px;font-weight:600}
.meta-gz{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:2px;margin-bottom:8px}
.meta-ju{
  display:inline-block;background:var(--red);color:#E8D5A3;
  padding:3px 12px;border-radius:12px;font-size:13px;font-weight:600;
  letter-spacing:1px;margin-bottom:8px
}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.meta-item{background:#F8F4EC;border-radius:7px;padding:7px 10px}
.meta-k{font-size:9px;color:var(--sub);margin-bottom:2px;font-weight:600}
.meta-v{font-size:12px;color:var(--ink);font-weight:600;line-height:1.4}
.meta-v.zf{color:var(--grn)}.meta-v.zs{color:var(--red)}

/* 九宮格 */
.pan-wrap{background:var(--card);border-radius:12px;border:1px solid var(--brd);
  overflow:hidden;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.pan-header{
  background:linear-gradient(135deg,#1A1A2E,#2C1810);color:#E8D5A3;
  padding:9px 14px;font-size:11px;letter-spacing:2px;font-weight:600
}
.pan-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-left:1px solid var(--brd);border-top:1px solid var(--brd);
}
.cell{
  border-right:1px solid var(--brd);border-bottom:1px solid var(--brd);
  padding:10px 6px 22px;min-height:138px;position:relative;
  display:flex;flex-direction:column;align-items:stretch;justify-content:center;
  gap:2px;
  background:var(--card);
}
.cell.center-cell{background:#FDFAF2}
.cell.is-zf{background:#EEF7EE}  /* 值符所在宮 */
.cell.is-zs{background:#FEF3F3}  /* 值使所在宮 */
/* 宮名：荀爽老師排盤裡宮名是小字放在格子角落，不是標題，用絕對定位釘在右下角，
   這樣主要內容(干/門/神/星)可以在格子正中間垂直置中，不受宮名影響。
   顏色規則：有空亡才變藍色(跟 lh-kong 同色)，沒有就是預設(白/淡)色 —— 嚴格對齊六害配色表，不摻雜取象顏色 */
.cell-gua{
  position:absolute;right:6px;bottom:4px;
  font-size:9px;color:var(--ink);opacity:.55;font-weight:600;letter-spacing:.5px;
}
.cell-gua.kongwang{color:#2E6FD9;opacity:1;font-weight:700}
/* 方位：對照荀爽老師視頻九宮外圍的「東南/南/西南...」標法，釘在格子左上角(跟宮名右下角相對) */
.cell-dir{
  position:absolute;left:6px;top:4px;
  font-size:9px;color:var(--ink);opacity:.4;font-weight:600;letter-spacing:1px;
}
/* 第一行：天干(左) + 神(右)，同一行並排 —— 對齊荀爽老師「干←乙 符」的排法 */
.c-line{display:flex;align-items:baseline;justify-content:center;gap:6px;min-height:22px}
/* 天干 (天盤)：預設白色/淡色，只有命中六害才變色——嚴格對齊荀爽老師配色表:
   擊刑=紅 / 入墓=藍 / 庚=金黃 / 其餘一律預設色，不再套用材質取象顏色 */
.c-sky{
  font-size:22px;font-weight:900;color:var(--ink);line-height:1;
}
.c-sky.dim{color:var(--ink);opacity:.4;font-weight:400;font-size:16px}
.c-sky.jixing{color:#C0392B}
.c-sky.rumu{color:#4FC3F7}
.c-sky.geng-stem{color:#D4AF37}
/* 地干 (地盤) */
.c-earth{
  font-size:14px;font-weight:700;color:var(--ink);opacity:.75;line-height:1;
}
/* 神值：緊跟在天干右邊，同行顯示。預設白色/淡色，只有白虎才變金黃。
   顯示完整名字(如玄武/九天)，字數變多了，字距收緊一點比較整齊 */
.c-god-val,.c-star-val{
  font-size:12px;font-weight:700;color:var(--ink);opacity:.85;letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:3px;line-height:1.3;
}
.c-god-val.baihu{color:#D4AF37;opacity:1;font-weight:800}
/* 第二行：門，獨立居中一行 —— 對齊荀爽老師把門放在天干/地干中間單獨一行的排法。
   預設白色/淡色，只有門迫才變綠。顯示「X門」完整名字 */
.c-door-line{display:flex;justify-content:center;margin:3px 0}
.c-door-val{
  font-size:14px;font-weight:800;color:var(--ink);letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:3px;line-height:1;
}
.c-door-val.menpo{color:#4A9B4A}
/* 空亡標記 (跟 cell-gua.kongwang 同色系, 都是藍) */
.c-kong{
  position:absolute;top:4px;right:4px;
  font-size:8px;color:#2E6FD9;background:#EAF1FC;
  border-radius:3px;padding:1px 3px;font-weight:700
}
/* 值符/值使標籤 */
.c-special{
  font-size:8px;font-weight:700;border-radius:3px;padding:1px 4px;
  margin-top:2px;align-self:center;
}
.c-special.zf-tag{background:var(--grn);color:#fff}
.c-special.zs-tag{background:var(--red);color:#fff}

/* 擊刑/入墓 顏色已經由 .c-sky.jixing / .c-sky.rumu 直接改字色表達，這裡只加小記號輔助辨識 */
.c-sky.jixing::after{
  content:'✕';font-size:9px;color:#C0392B;margin-left:2px;vertical-align:super
}
.c-sky.rumu::after{
  content:'▽';font-size:8px;color:#4FC3F7;margin-left:2px;vertical-align:super
}

/* INFO CARD: 節氣/旬空/長生 */
.info-card{background:var(--card);border-radius:12px;padding:14px 16px;
  border:1px solid var(--brd);margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.info-title{font-size:10px;color:var(--sub);letter-spacing:1.5px;margin-bottom:10px;font-weight:600}
.info-row{display:flex;align-items:center;margin-bottom:6px}
.info-row:last-child{margin-bottom:0}
.info-k{font-size:11px;color:var(--sub);width:52px;flex-shrink:0}
.info-v{font-size:12px;color:var(--ink);font-weight:600}
.info-v .pill{
  display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px;margin-right:4px
}
.pill-ji{background:#E8F5E9;color:var(--grn)}
.pill-xiong{background:#FEF0F0;color:var(--red)}
.pill-neutral{background:#F5F5F0;color:var(--sub)}

/* 本局解讀（白話摘要卡，在六害明細卡之上） */
.analysis-card{background:#F7F9FC;border:1px solid #D8E0EC;border-radius:10px;
  padding:12px 14px;margin-bottom:10px;font-size:12.5px;color:#233;line-height:1.75}
.ana-block{margin-bottom:10px}
.ana-block:last-child{margin-bottom:0}
.ana-h{font-weight:700;color:#1A3A6B;margin-bottom:3px;font-size:11px;letter-spacing:1px}
.ana-item{margin-bottom:8px;padding-left:2px}
.ana-step{padding-left:16px;opacity:.85;font-size:12px;margin-top:2px}

/* 六害說明卡 */
.liuhai-card{background:#FEF9F9;border:1px solid #F5D5D5;border-radius:10px;
  padding:12px 14px;margin-bottom:10px;font-size:12px;color:#5C1010;line-height:1.7}
.liuhai-sec{margin-bottom:8px}
.liuhai-sec:last-child{margin-bottom:0}
.liuhai-title{font-weight:700;margin-bottom:4px;letter-spacing:1px;display:flex;align-items:center;gap:5px}
.liuhai-title .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
/* 六害配色 據荀爽視頻「六害」對照表逐字轉錄: 刑=紅 墓=淺藍 庚=金黃 迫=綠 虎=金黃 空=藍紫
   (其餘說明文字不額外上色, 沿用預設文字色) */
.lh-word{font-weight:700}
.lh-xing{color:#C0392B} /* 刑：紅 */
.lh-mu{color:#4FC3F7}   /* 墓：淺藍 */
.lh-geng{color:#D4AF37} /* 庚：金黃 */
.lh-po{color:#4A9B4A}   /* 迫：綠 */
.lh-hu{color:#D4AF37}   /* 虎：金黃 */
.lh-kong{color:#2E6FD9} /* 空：藍 */
.liuhai-title.jx .dot{background:#C0392B}
.liuhai-title.rm .dot{background:#4FC3F7}
.liuhai-title.mp .dot{background:#D4AF37}
.liuhai-title.po .dot{background:#4A9B4A}
.liuhai-title.kw .dot{background:#2E6FD9}
.cure-line{margin-top:3px;padding:6px 8px;background:#FFF3F3;border-radius:6px;font-size:12px;line-height:1.6}
.hl-badge{font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px;font-weight:700}
.hl-hit{background:#FDE8E8;color:var(--red)}
.hl-bg{background:#EFEFEF;color:#888}


/* cross-nav */
.cross-nav{
  position:fixed;bottom:20px;
  right:max(16px, calc((100vw - 500px) / 2 + 16px));
  z-index:999;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end
}
.cross-nav a{
  display:flex;align-items:center;gap:8px;
  background:rgba(26,26,46,.92);color:#E8D5A3;
  border-radius:24px;padding:8px 14px 8px 10px;
  text-decoration:none;font-size:12px;letter-spacing:1px;
  box-shadow:0 2px 10px rgba(0,0,0,.3);backdrop-filter:blur(4px);
  transition:transform .15s,opacity .15s;
}
.cross-nav a:hover{opacity:.88;transform:scale(1.04)}
.cross-nav a .nav-icon{font-size:16px}

/* ── clickable terms ── */
.term{cursor:pointer}
.term:active{opacity:.6}
.c-sky.term, .c-earth.term{border-bottom:1px dotted currentColor;padding-bottom:1px}

/* ── bottom sheet ── */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:990;
  opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:500px;margin:0 auto;
  background:var(--card);border-radius:18px 18px 0 0;z-index:991;
  padding:8px 20px 28px;transform:translateY(100%);transition:transform .25s ease;
  box-shadow:0 -6px 24px rgba(0,0,0,.18);max-height:75vh;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet-bar{width:36px;height:4px;background:var(--brd);border-radius:2px;margin:6px auto 14px}
.sheet-term{font-size:20px;font-weight:800;color:var(--red);margin-bottom:4px}
.sheet-sub{font-size:12px;color:var(--gold);font-weight:600;margin-bottom:10px;letter-spacing:1px}
.sheet-meta{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sheet-tag{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600}
.sheet-tag.color{background:#F5F0E8;color:var(--ink)}
.sheet-tag.luck-ji{background:#E8F5E9;color:var(--grn)}
.sheet-tag.luck-xiong{background:#FEF0F0;color:var(--red)}
.sheet-tag.luck-neu{background:#F0F0F0;color:var(--sub)}
.sheet-desc{font-size:14px;color:var(--ink);line-height:1.85}
footer{text-align:center;font-size:10px;color:var(--sub);padding:16px;letter-spacing:.5px}

/* empty state */
.empty{
  text-align:center;padding:48px 20px;color:var(--sub);
  font-size:14px;line-height:2;letter-spacing:1px
}
.empty .big{font-size:32px;margin-bottom:8px}
</style>
</head>
<body>

<header>
  <div class="h-title">奇門遁甲</div>
  <div class="h-sub" id="hdate"></div>
</header>

<div class="input-panel">
  <div class="input-row">
    <div class="input-label">日期</div>
    <input class="inp" type="date" id="iDate">
    <button class="btn-now" onclick="setNow()">現在</button>
  </div>
  <div class="input-row">
    <div class="input-label">時間</div>
    <input class="inp" type="time" id="iTime">
  </div>
  <div class="input-row">
    <div class="input-label">生年</div>
    <input class="inp" type="text" id="iYears" placeholder="家中長住者生年,如 1990,1988,2015">
  </div>
  <div class="input-row">
    <div class="input-label">所求</div>
    <select class="inp" id="iNeed">
      <option value="求財">求財</option>
      <option value="求事業">求事業（推導，未經視頻原文驗證）</option>
      <option value="求權威地位">求權威地位</option>
      <option value="求表現曝光">求表現曝光</option>
      <option value="求情感情欲">求情感情欲</option>
      <option value="求桃花">求桃花（推導，未經視頻原文驗證）</option>
      <option value="求突破變革">求突破變革</option>
    </select>
  </div>
  <div class="input-row">
    <div class="input-label">局類型</div>
    <select class="inp" id="iJuType">
      <option value="事局">事局（問一件事/一件事的走向）</option>
      <option value="命局">命局（用某個人的出生時刻，分析這個人）</option>
    </select>
  </div>
  <button class="btn-ritual" onclick="toggleRitual()" type="button">☯ 起局須知 / 起局儀式</button>
  <div class="ritual-panel" id="ritualPanel" style="display:none"></div>
  <button class="btn-ritual" onclick="toggleHistory()" type="button">🕘 起局歷史記錄</button>
  <div class="ritual-panel" id="historyPanel" style="display:none"></div>
  <button class="btn-calc" onclick="calc()">起　局</button>
</div>

<div class="result" id="result">
  <div class="empty">
    <div class="big">☯</div>
    輸入時間後點「起局」<br>即可起一局時家奇門<br>
    <span style="font-size:11px;opacity:.7">拆補法 · 時家轉盤</span>
  </div>
</div>

<div class="sheet-mask" id="smask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-bar"></div>
  <div class="sheet-term" id="sterm"></div>
  <div class="sheet-sub" id="ssub"></div>
  <div class="sheet-meta" id="smeta"></div>
  <div class="sheet-desc" id="sdesc"></div>
</div>


<footer>時家奇門遁甲 · 拆補法 · lunar-javascript (6tail) · 無廣告</footer>

<script>
// qimen.js — 時家奇門 拆補法 JS port (v1)
// Ported from kentang2017/kinqimen (config.py + kinqimen.py), MIT licensed source.
// Astronomy layer (干支/節氣) delegated to lunar-javascript (6tail), already
// verified accurate in our 萬年曆 project — avoids re-deriving ephemeris in JS.

(function (global) {
'use strict';

const TIAN_GAN = '甲乙丙丁戊己庚辛壬癸';
const DI_ZHI = '子丑寅卯辰巳午未申酉戌亥';
const CNUMBER = ['一','二','三','四','五','六','七','八','九']; // 1-9 (宮位/局數共用)
const EIGHT_GUA = ['坎','坤','震','巽','中','乾','兌','艮','離']; // index by CNUMBER position (1-9)
const CLOCKWISE_EIGHTGUA = ['坎','艮','震','巽','離','坤','兌','乾']; // 8 palaces only, clockwise order, no 中
const DOOR_R = ['休','生','傷','杜','景','死','驚','開'];
const STAR_R = ['蓬','任','沖','輔','英','內','柱','心'];
// 八神只有這 8 個：符/蛇/陰/合/虎/玄/地/天 (螣蛇/值符/太陰/六合/白虎/玄武/九地/九天)。
// 陽遁的校正已由實測案例(1901-04-13 14:30)驗證：陽遁用「虎玄」而非 kinqimen 預設的「勾雀」。
// 陰遁原本假設「相反」沿用勾雀，但荀爽老師視頻「八神原宮」參考圖清楚列出就是這固定 8 個，
// 陰陽遁不分、不存在勾陳/朱雀 —— 已依此改正，兩個陣列統一。
const GOD_YANG = ['符','蛇','陰','合','虎','玄','地','天'];
const GOD_YIN  = ['符','蛇','陰','合','虎','玄','地','天'];

// 節氣 → 上中下元局數對照 (拆補法), directly transcribed from kinqimen/config.py
const JIEQI_CODE = {
  '冬至':'一七四', '驚蟄':'一七四',
  '小寒':'二八五',
  '大寒':'三九六', '春分':'三九六',
  '立春':'八五二',
  '雨水':'九六三',
  '清明':'四一七', '立夏':'四一七',
  '穀雨':'五二八', '小滿':'五二八',
  '芒種':'六三九',
  '夏至':'九三六', '白露':'九三六',
  '小暑':'八二五',
  '大暑':'七一四', '秋分':'七一四',
  '立秋':'二五八',
  '處暑':'一四七',
  '霜降':'五八二', '小雪':'五八二',
  '寒露':'六九三', '立冬':'六九三',
  '大雪':'四七一'
};
// 陽遁節氣 (冬至→芒種) vs 陰遁節氣 (夏至→大雪)
const YANG_JIEQI = new Set(['冬至','小寒','大寒','立春','雨水','驚蟄','春分','清明','穀雨','立夏','小滿','芒種']);

// ── 基礎工具函數 (對應 config.py 的同名函式) ──
function jiazi() {
  const arr = [];
  for (let i = 0; i < 60; i++) arr.push(TIAN_GAN[i % 10] + DI_ZHI[i % 12]);
  return arr;
}
const JIAZI60 = jiazi();

// new_list: 把 olist 旋轉，讓元素 o 排到最前面 (對應 config.py new_list)
function newList(olist, o) {
  const idx = olist.indexOf(o);
  if (idx === -1) return null;
  return olist.slice(idx).concat(olist.slice(0, idx));
}
// new_list_r: 從 o 開始往「前」(逆序) 取，長度同 olist (對應 config.py new_list_r)
function newListR(olist, o) {
  let idx = olist.indexOf(o);
  const res = [];
  for (let i = 0; i < olist.length; i++) {
    res.push(olist[((idx % olist.length) + olist.length) % olist.length]);
    idx -= 1;
  }
  return res;
}

// 旬首: 任一干支 → 它所屬「旬」的甲子頭 (對應 config.py liujiashun_dict 查表邏輯)
function xunShouOf(gz) {
  const idx = JIAZI60.indexOf(gz);
  const headIdx = Math.floor(idx / 10) * 10;
  return JIAZI60[headIdx];
}

// 旬首對應的「值符遁干」(對應 config.py shun())
// 甲子旬→戊 甲戌旬→己 甲申旬→庚 甲午旬→辛 甲辰旬→壬 甲寅旬→癸
const XUN_TO_DUNGAN = {'甲子':'戊','甲戌':'己','甲申':'庚','甲午':'辛','甲辰':'壬','甲寅':'癸'};
function shun(dayGz) {
  return XUN_TO_DUNGAN[xunShouOf(dayGz)];
}

// ── 干支計算 (用 lunar-javascript 取代 ephem+sxtwl, 邏輯對應 config.py gangzhi()) ──
// 規則: 整點取時 (分鐘只影響旬空/分干支, 此處先不處理刻家), 23點視為次日子時 (晚子時進位)
function getGanZhi(Solar, year, month, day, hour, minute) {
  let y = year, m = month, d = day, h = hour;
  if (hour === 23) {
    // 23點 → 次日 00:00 (晚子時進位)
    const next = Solar.fromYmdHms(year, month, day, 23, 0, 0).next(1); // +1 day via Solar helper
    y = next.getYear(); m = next.getMonth(); d = next.getDay(); h = 0;
  }
  const solar = Solar.fromYmdHms(y, m, d, h, 0, 0);
  const lunar = solar.getLunar();
  const yGz = lunar.getYearInGanZhiByLiChun();
  const mGz = lunar.getMonthInGanZhiByLiChun ? lunar.getMonthInGanZhiByLiChun() : lunar.getMonthInGanZhi();
  const dGz = lunar.getDayInGanZhi();
  // 時柱: 用「五鼠遁」依日干獨立推算 (對應 config.py find_lunar_hour, 不直接信任 sxtwl 的時柱)
  const dayGan = dGz[0];
  const FIVE_RATS_START = {'甲':'甲子','己':'甲子','乙':'丙子','庚':'丙子','丙':'戊子','辛':'戊子','丁':'庚子','壬':'庚子','戊':'壬子','癸':'壬子'};
  const startGz = FIVE_RATS_START[dayGan];
  const startIdx = TIAN_GAN.indexOf(startGz[0]);
  // 時辰地支: 用「原始」小時 (不是進位後的 h), 因為時辰本身就是依原始時刻判斷
  const hourBranchIdx = (hour === 23) ? 0 : Math.floor((hour + 1) / 2) % 12;
  const hGan = TIAN_GAN[(startIdx + hourBranchIdx) % 10];
  const hGz = hGan + DI_ZHI[hourBranchIdx];
  return [yGz, mGz, dGz, hGz];
}

// ── 節氣 (取代 ephem-based config.py jq()): 用 lunar-javascript 的「上一個節氣」 ──
// lunar-javascript 回傳簡體節氣名 (如"处暑"), 我們的對照表用繁體 (如"處暑"), 需轉換
const JIEQI_S2T = {
  '冬至':'冬至','小寒':'小寒','大寒':'大寒','立春':'立春','雨水':'雨水','惊蛰':'驚蟄',
  '春分':'春分','清明':'清明','谷雨':'穀雨','立夏':'立夏','小满':'小滿','芒种':'芒種',
  '夏至':'夏至','小暑':'小暑','大暑':'大暑','立秋':'立秋','处暑':'處暑','白露':'白露',
  '秋分':'秋分','寒露':'寒露','霜降':'霜降','立冬':'立冬','小雪':'小雪','大雪':'大雪',
  // getJieQiTable() 偶爾會用拼音常數作為key (通常是跨年回溯補的那一筆), 一併對應
  'DA_HAN':'大寒','DA_XUE':'大雪','DONG_ZHI':'冬至','JING_ZHE':'驚蟄',
  'LI_CHUN':'立春','XIAO_HAN':'小寒','YU_SHUI':'雨水'
};
function getCurrentJieQi(lunar, targetDate) {
  // getPrevJieQi(true) 只精確到「天」, 同一天內若查詢時刻早於節氣交接的時分秒會誤判,
  // 改用 getJieQiTable() 逐筆比對完整時間戳, 取小於等於查詢時刻的最近一個節氣
  const tbl = lunar.getJieQiTable();
  let best = null, bestTime = null;
  for (const [name, jq] of Object.entries(tbl)) {
    const t = new Date(jq.getYear(), jq.getMonth() - 1, jq.getDay(), jq.getHour(), jq.getMinute(), jq.getSecond());
    if (t <= targetDate && (!bestTime || t > bestTime)) { best = name; bestTime = t; }
  }
  return JIEQI_S2T[best] || best;
}

// ── 排局拆補法 (對應 config.py qimen_ju_name_chaibu) ──
// 回傳 [陰陽, 局數(中文數字), 上中下元]
function findYuen(dayGz) {
  const idx = JIAZI60.indexOf(dayGz);
  const group = Math.floor(idx / 5);
  return ['上元','中元','下元'][group % 3];
}
function qimenJuChaibu(jieqiName, dayGz) {
  const yinyang = YANG_JIEQI.has(jieqiName) ? '陽' : '陰';
  const yuen = findYuen(dayGz);
  const codes = JIEQI_CODE[jieqiName]; // 三字串: 上中下元局數
  const yuenIdx = {'上元':0,'中元':1,'下元':2}[yuen];
  const kook = codes[yuenIdx]; // 中文數字 一~九
  return { yinyang, kook, yuen, label: `${yinyang}遁${kook}局${yuen}` };
}

// ── 旬空 / 孤虛 (對應 config.py daykong_shikong) ──
const GUXU = {
  '甲子': '戌亥', '甲戌': '申酉', '甲申': '午未',
  '甲午': '辰巳', '甲辰': '寅卯', '甲寅': '子丑'
};
function dayKongShiKong(dayGz, hourGz) {
  const dXun = xunShouOf(dayGz);
  const hXun = xunShouOf(hourGz);
  return { 日空: GUXU[dXun], 時空: GUXU[hXun] };
}

// ── 局日 (對應 kinqimen.py qimen_ju_day) ──
const JU_DAY_PAIR = {
  '甲':'甲己日','己':'甲己日','乙':'乙庚日','庚':'乙庚日',
  '丙':'丙辛日','辛':'丙辛日','丁':'丁壬日','壬':'丁壬日',
  '戊':'戊癸日','癸':'戊癸日'
};
function juDay(dayGz) { return JU_DAY_PAIR[dayGz[0]]; }

// ── 布六儀三奇 (值符/值使排盤的基礎, 對應 config.py zhifu_pai / zhishi_pai) ──
// 陽遁/陰遁 各9局的基礎排列 (1-9宮序列字串), 直接轉錄自 config.py
const ZHIFU_PAI_TABLE = {
  陽: {'一':'九八七一二三四五六','二':'一九八二三四五六七','三':'二一九三四五六七八',
       '四':'三二一四五六七八九','五':'四三二五六七八九一','六':'五四三六七八九一二',
       '七':'六五四七八九一二三','八':'七六五八九一二三四','九':'八七六九一二三四五'},
  陰: {'九':'一二三九八七六五四','八':'九一二八七六五四三','七':'八九一七六五四三二',
       '六':'七八九六五四三二一','五':'六七八五四三二一九','四':'五六七四三二一九八',
       '三':'四五六三二一九八七','二':'三四五二一九八七六','一':'二三四一九八七六五'}
};
// 回傳: {旬首甲子: 該旬對應的宮位序列(中文數字+局序列, 6碼字串)}
function zhifuPai(yinyang, kook) {
  const pai = ZHIFU_PAI_TABLE[yinyang][kook];
  const heads = JIAZI60.filter((_, i) => i % 10 === 0); // 6個旬首
  const rotated = yinyang === '陰' ? newListR(CNUMBER, kook) : newList(CNUMBER, kook);
  const six = rotated.slice(0, 6).map(x => x + pai);
  const out = {};
  heads.forEach((h, i) => { out[h] = six[i]; });
  return out;
}
function zhishiPai(yinyang, kook) {
  const newKook = newList(CNUMBER, kook);
  const newRKook = newListR(CNUMBER, kook);
  const seqArr = yinyang === '陰' ? newRKook : newKook;
  const seq3 = seqArr.join('') + seqArr.join('') + seqArr.join('');
  const heads = JIAZI60.filter((_, i) => i % 10 === 0);
  const six = seqArr.slice(0, 6).map(ch => {
    const pos = seq3.indexOf(ch) + 1;
    return ch + seq3.slice(pos, pos + 11);
  });
  const out = {};
  heads.forEach((h, i) => { out[h] = six[i]; });
  return out;
}

// ── 值符值使 (對應 config.py zhifu_n_zhishi) ──
const GONG_BY_CNUM = Object.fromEntries(CNUMBER.map((c, i) => [c, EIGHT_GUA[i]]));
const EG_DOOR_ORDER = ['休','死','傷','杜','中','開','驚','生','景']; // zspai_values 的星序對映門
const EIGHT_STAR_ORDER = ['蓬','內','沖','輔','禽','心','柱','任','英']; // zf_values 對映星
function zhifuNZhishi(yinyang, kook, dayGz, hourGz) {
  const hGanIdx = TIAN_GAN.indexOf(hourGz[0]);
  const hourXun = xunShouOf(hourGz); // chour: 時干支所屬旬首
  const zs = zhishiPai(yinyang, kook); // 旬首 -> 6碼序列(值使排)
  const zf = zhifuPai(yinyang, kook);  // 旬首 -> 6碼序列(值符排)
  const zsSeq = zs[hourXun]; // e.g. "三四五六七八九一二三四五"
  const zfSeq = zf[hourXun];
  const doorChar = EG_DOOR_ORDER[CNUMBER.indexOf(zsSeq[0])];
  const door = doorChar === '中' ? '死' : doorChar;
  const starChar = EIGHT_STAR_ORDER[CNUMBER.indexOf(zfSeq[0])];
  const starGong = GONG_BY_CNUM[zfSeq[hGanIdx]];
  const doorGong = GONG_BY_CNUM[zsSeq[hGanIdx]];
  const JJ = {'甲子':'戊','甲戌':'己','甲申':'庚','甲午':'辛','甲辰':'壬','甲寅':'癸'};
  return {
    值符天干: [hourXun, JJ[hourXun]],
    值符星宮: [starChar, starGong],
    值使門宮: [door, doorGong]
  };
}

// ── 地盤 (對應 kinqimen.py pan_earth) ──
const EARTH_YANG = ['戊','己','庚','辛','壬','癸','丁','丙','乙'];
const EARTH_YIN  = ['戊','乙','丙','丁','癸','壬','辛','庚','己'];
function panEarth(yinyang, kook) {
  const order = newList(CNUMBER, kook).map(c => GONG_BY_CNUM[c]);
  const stems = yinyang === '陽' ? EARTH_YANG : EARTH_YIN;
  const out = {};
  order.forEach((g, i) => { out[g] = stems[i]; });
  return out;
}

// ── 八門 / 九星 / 八神 旋轉佈局 (對應 config.py pan_door / pan_star / pan_god) ──
function rotateFromGong(startGong, yinyang) {
  const rotate = yinyang === '陽' ? CLOCKWISE_EIGHTGUA : [...CLOCKWISE_EIGHTGUA].reverse();
  const base = startGong === '中' ? '坤' : startGong;
  return newList(rotate, base);
}
function panDoor(yinyang, zfzs) {
  const [startDoor, startGong] = zfzs.值使門宮;
  const gongOrder = rotateFromGong(startGong, yinyang);
  const doorSeq = yinyang === '陽' ? newList(DOOR_R, startDoor) : newList([...DOOR_R].reverse(), startDoor);
  const out = {};
  gongOrder.forEach((g, i) => { out[g] = doorSeq[i]; });
  return out;
}
function panStar(yinyang, zfzs) {
  let [startStar, startGong] = zfzs.值符星宮;
  if (startStar === '內') startStar = '禽';
  const gongOrder = rotateFromGong(startGong, yinyang);
  const starSeq = yinyang === '陽' ? newList(STAR_R, startStar) : newList([...STAR_R].reverse(), startStar);
  const out = {};
  gongOrder.forEach((g, i) => { out[g] = starSeq[i]; });
  return out;
}
function panGod(yinyang, zfzs) {
  const startGong = zfzs.值符星宮[1];
  const gongOrder = rotateFromGong(startGong, yinyang);
  const godSeq = yinyang === '陽' ? GOD_YANG : GOD_YIN;
  const out = {};
  gongOrder.forEach((g, i) => { out[g] = godSeq[i]; });
  return out;
}

// ── 天盤 (對應 kinqimen.py pan_sky) ──
// 注意: Python 原始碼在「值符落中宮」分支裡, gong_reorder = new_list(rotate,"中") 必定
// 找不到"中"(rotate只有8個非中宮位)而拋例外, 因此程式實際永遠走 except 分支, 且該分支
// 內 pan_god(...).get("坤") 在此情境下恆等於"符"(值符), 故再下一層判斷永遠是
// earth.get("坤") == fu_head 與否這兩種情況。以下直接實作這兩種真實會發生的情況。
function panSky(yinyang, kook, zfzs, earth, fuHead, hourGanChar) {
  const rotate = yinyang === '陽' ? CLOCKWISE_EIGHTGUA : [...CLOCKWISE_EIGHTGUA].reverse();
  const fuHeadLocation = zfzs.值符星宮[1];
  const zhifu = zfzs.值符星宮[0];

  if (fuHeadLocation === '中') {
    const a = rotate.map(g => earth[g]); // 8個非中宮位的地盤干, 依 rotate 順序
    const gongReorder = newList(rotate, '坤'); // 恆以坤為起點 (見上方說明)
    let ganReorder;
    if (earth['坤'] === fuHead) {
      const lastOfA = a[a.length - 1];
      ganReorder = newList(a, lastOfA);
    } else {
      // 對應 Python 巢狀 try/except: 先試 fuHead, 若 fuHead 本身就是中宮的干
      // (不在這8個非中宮值之中), 退而求其次改用坤宮本身的干作軸心
      ganReorder = newList(a, fuHead) || newList(a, earth['坤']);
    }
    const out = {};
    gongReorder.forEach((g, i) => { out[g] = ganReorder[i]; });
    return out; // 此分支不附加"中"鍵, 與原始邏輯一致
  }

  // fuLocation: 時干(非時干支旬首遁干, 是時柱本身的天干字元)所在的地盤宮位
  // 若時干恰為"甲"(旬首本字), 地盤從不直接顯示甲, 此時 fuLocation 為 null
  const earthR = {};
  Object.entries(earth).forEach(([g, s]) => { earthR[s] = g; });
  const fuLocation = Object.prototype.hasOwnProperty.call(earthR, hourGanChar) ? earthR[hourGanChar] : null;

  if (zhifu !== '禽') {
    const earthSeq = rotate.map(g => earth[g]);
    const ganReorder = newList(earthSeq, fuHead);
    const gongReorder = newList(rotate, fuHeadLocation);
    if (fuLocation === null) {
      return { ...earth }; // 原始碼: 直接回傳整個地盤 (含"中")
    }
    const out = {};
    gongReorder.forEach((g, i) => { out[g] = ganReorder[i]; });
    out['中'] = earth['中'];
    return out;
  }

  // 值符星 = 禽星 (寄坤二宮) 分支
  const earthSeq = rotate.map(g => earth[g]);
  const ganReorder = newList(earthSeq, earth['坤']);
  const gongReorder = newList(rotate, fuHeadLocation);
  if (!ganReorder.includes(fuHead)) {
    const rGongReorder = newList(gongReorder, fuLocation);
    const out = {};
    rGongReorder.forEach((g, i) => { out[g] = ganReorder[i]; });
    return out;
  }
  const out = {};
  gongReorder.forEach((g, i) => { out[g] = ganReorder[i]; });
  out['中'] = earth['中'];
  return out;
}

// ── 值符 (時干支所屬旬首對應的遁干所在地盤宮位的干, 用於天盤公式的 fuHead) ──
// 對應 kinqimen.py hourganghzi_zhifu(): 找時干支所屬旬首, 取其遁干(戊己庚辛壬癸之一)
function hourGanzhiZhifu(hourGz) {
  return XUN_TO_DUNGAN[xunShouOf(hourGz)];
}

// ── 主函式: 起時家奇門局 (拆補法) ──
function qimenChaibu(Solar, year, month, day, hour, minute) {
  const [yGz, mGz, dGz, hGz] = getGanZhi(Solar, year, month, day, hour, minute);
  const solar = Solar.fromYmdHms(year, month, day, hour, minute, 0);
  const lunar = solar.getLunar();
  const jieqiName = getCurrentJieQi(lunar, new Date(year, month - 1, day, hour, minute, 0));

  const ju = qimenJuChaibu(jieqiName, dGz);
  const zfzs = zhifuNZhishi(ju.yinyang, ju.kook, dGz, hGz);
  const earth = panEarth(ju.yinyang, ju.kook);
  const fuHead = hourGanzhiZhifu(hGz);
  const sky = panSky(ju.yinyang, ju.kook, zfzs, earth, fuHead, hGz[0]);
  const door = panDoor(ju.yinyang, zfzs);
  const star = panStar(ju.yinyang, zfzs);
  const god = panGod(ju.yinyang, zfzs);
  const kong = dayKongShiKong(dGz, hGz);

  return {
    排盤方式: '拆補',
    干支: `${yGz}年${mGz}月${dGz}日${hGz}時`,
    旬首: shun(dGz),
    旬空: kong,
    局日: juDay(dGz),
    排局: ju.label,
    節氣: jieqiName,
    值符值使: zfzs,

const HISTORY_KEY='qimen_history_v1';
const HISTORY_MAX=300;
function loadHistory(){
  try{
    const raw=localStorage.getItem(HISTORY_KEY);
    return raw?JSON.parse(raw):[];
  }catch(e){ return []; }
}
function saveHistoryList(list){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }
  catch(e){ console.warn('歷史記錄儲存失敗(可能是瀏覽器儲存空間已滿)', e); }
}
// 只存起局的「輸入條件」與「摘要結果」，不存完整盤面 —— 之後重新排盤用同一套算法算，
// 未來算法若有修正，回看歷史時會自動用最新邏輯重算，而不是凍結在存檔當下的舊結果
function pushHistoryRecord(rec){
  const list=loadHistory();
  list.unshift(rec); // 最新的放最前面
  if(list.length>HISTORY_MAX) list.length=HISTORY_MAX;
  saveHistoryList(list);
}
function deleteHistoryRecord(id){
  const list=loadHistory().filter(r=>r.id!==id);
  saveHistoryList(list);
  renderHistoryPanel();
}
function clearHistoryAll(){
  if(!confirm('確定清空全部起局歷史記錄？此操作無法復原。'))return;
  saveHistoryList([]);
  renderHistoryPanel();
}
function reloadHistoryRecord(id){
  const rec=loadHistory().find(r=>r.id===id);
  if(!rec)return;
  document.getElementById('iDate').value=rec.dateStr;
  document.getElementById('iTime').value=rec.timeStr;
  document.getElementById('iNeed').value=rec.needKey||'求財';
  document.getElementById('iYears').value=rec.yearsInput||'';
  document.getElementById('iJuType').value=rec.juType||'事局';
  document.getElementById('ritualPanel').style.display='none';
  document.getElementById('historyPanel').style.display='none';
  calc();
  window.scrollTo({top:0,behavior:'smooth'});
}
function exportHistoryJson(){
  const list=loadHistory();
  const blob=new Blob([JSON.stringify(list,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`qimen_history_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importHistoryJson(fileInput){
  const file=fileInput.files&&fileInput.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const imported=JSON.parse(e.target.result);
      if(!Array.isArray(imported))throw new Error('格式不對');
      const existing=loadHistory();
      const existingIds=new Set(existing.map(r=>r.id));
      const merged=existing.concat(imported.filter(r=>r&&r.id&&!existingIds.has(r.id)));
      merged.sort((a,b)=>b.id-a.id);
      saveHistoryList(merged.slice(0,HISTORY_MAX));
      renderHistoryPanel();
      alert(`已匯入，目前共有 ${merged.length} 筆歷史記錄`);
    }catch(err){ alert('匯入失敗：檔案格式不正確'); }
  };
  reader.readAsText(file);
  fileInput.value='';
}
/* 簡易 HTML 轉義, 避免復盤文字裡的 < > 等符號破壞畫面結構 */

}

      <button class="h-btn" onclick="exportHistoryJson()">匯出備份</button>

    <div class="h-list">${rows||'<div style="opacity:.6;padding:10px 0">尚無記錄</div>'}</div>`;

function saveReview(id){

  const ta=document.getElementById('review_'+id);

}

const JIXING_TABLE={'戊':'震','己':'坤','庚':'艮','辛':'離','壬':'巽','癸':'巽'};

  }

}

const DOOR_WUXING={'休':'水','生':'土','傷':'木','杜':'木','景':'火','死':'土','驚':'金','開':'金'};
const GONG_WUXING={'坎':'水','坤':'土','震':'木','巽':'木','離':'火','兌':'金','艮':'土','乾':'金','中':'土'};
const KE_MAP={'木':'土','土':'水','水':'火','火':'金','金':'木'};
function checkMenPo(doorMap){
  const hits={};
  for(const [gua,door] of Object.entries(doorMap)){
    if(gua==='中'||!door)continue;
    const dWx=DOOR_WUXING[door], gWx=GONG_WUXING[gua];

}

  '火':{yi:'學習表達/展示型知識(如演講、藝術)', xing:'有氧/爆發類運動(如跑步、拳擊)'},

  '金':{yi:'學習決斷/規則型知識(如法律、金融)', xing:'剛強類運動(如器械、武術)'},
  '水':{yi:'學習流動/謀略型知識(如哲學、心理)', xing:'流動類運動(如游泳、慢跑)'},
};
function stemWuxing(stem){
  const map={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
  return map[stem];
}

const STEM_TO_BRANCH={'甲':'寅','乙':'卯','丙':'午','丁':'巳','戊':'辰','己':'丑','庚':'申','辛':'酉','壬':'子','癸':'亥'};

function getBuZhenXiang(stem){
  const d=LEX_DATA.stems[stem];

  const wx=stemWuxing(stem);
  const yx=WUXING_YI_XING[wx]||{};
  return {
    stem, wuxing:wx,
    zi:`寫「${stem}」字`,
    wu:`擺放${d.color}${d.material}類物品`,
    yi:yx.yi||'',
    xing:yx.xing||'',
    placement:'高處',
  };
}

function getBranchXiang(branch){
  const d=LEX_DATA.branches[branch];
  if(!d)return null;

  return {

}

function findStemOrHe(stem, panHasStemFn){
  if(panHasStemFn(stem)) return {found:stem, viaHe:false};

// ══════════════════ 號令: 日時/生年/意象/符使 四要素 ══════════════════
// 來源: 荀爽視頻「保護各干」截圖逐字轉錄
// 生年天干對照表 (西元年尾數 → 天干): 0庚 1辛 2壬 3癸 4甲 5乙 6丙 7丁 8戊 9己
const YEAR_LASTDIGIT_STEM={0:'庚',1:'辛',2:'壬',3:'癸',4:'甲',5:'乙',6:'丙',7:'丁',8:'戊',9:'己'};
function yearToStem(year){
  const y=parseInt(year,10);
  if(isNaN(y))return null;
  return YEAR_LASTDIGIT_STEM[((y%10)+10)%10];
}
// 從干支字串 (如「甲辰年丙寅月壬戌日己酉時」) 抽出日干/時干
function parseDayHourStem(ganzhiStr){
  const m=String(ganzhiStr||'').match(/(.)(.)年(.)(.)月(.)(.)日(.)(.)時/);
  if(!m)return {dayStem:null, hourStem:null};
  return {dayStem:m[5], hourStem:m[7]};
}
// 解析使用者輸入的多個生年 (逗號/頓號/空白分隔, 支援「家裡長住的所有人」多人同時保護)
function parseYearsInput(str){
  if(!str)return [];
  return String(str).split(/[,，、\s]+/).map(s=>s.trim()).filter(Boolean)
    .map(yearToStem).filter(Boolean);
}
// 組合出本次起局需要保護的天干集合 (號令四要素: 日時/生年/意象/符使)
function buildProtectedStems(ganzhiStr, yearsInput, needKey, zhifuStem){
  const set=new Set();
  const {dayStem,hourStem}=parseDayHourStem(ganzhiStr);
  if(dayStem)set.add(dayStem);
  if(hourStem)set.add(hourStem);
  parseYearsInput(yearsInput).forEach(s=>set.add(s));
  const target=NEED_TO_STEM[needKey];

      }
      const dr=door[g], st=star[g], gd=god[g];
      const doorInfo=LEX_DATA.doors[dr], starInfo=LEX_DATA.stars[st], godInfo=LEX_DATA.gods[gd];
      const doorName=doorInfo?doorInfo.name:(dr?`${dr}門`:null);
      const starName=starInfo?starInfo.name:(st?`${st}星`:null);
      const godName=godInfo?godInfo.name:gd;
      const parts=[doorName,starName,godName].filter(Boolean).map(T2).join('、');
      const frameWord=juType==='命局'?(label==='日'?'內心':'對外樣子'):(label==='日'?'本質':'表象');
      let html=`<div>${label}干「${T2(stem)}」落在<b>${T2(g)}宮</b>——這宮是${parts}，${juType==='命局'?'這個人的':'這件事的'}${frameWord}就看這三個組合起來：</div>`;
      if(doorInfo)html+=`<div class="ana-step">門象「${T2(doorName)}」（${T2(doorInfo.keyword||'')}）：${T2(doorInfo.desc||'')}</div>`;
      if(starInfo)html+=`<div class="ana-step">星象「${T2(starName)}」（${T2(starInfo.keyword||'')}）：${T2(starInfo.desc||'')}</div>`;
      if(godInfo)html+=`<div class="ana-step">神象「${T2(godName)}」（${T2(godInfo.keyword||'')}）：${T2(godInfo.desc||'')}</div>`;
      return html;
    };

    let openingHtml='';
    if(dayStem&&hourStem){
      const dStem=LEX_DATA.stems[dayStem], hStem=LEX_DATA.stems[hourStem];
      const juTypeNote=juType==='命局'
        ?'這局是<b>命局</b>——用某個人的出生時刻起局，來分析這個人本身。日干是這個人的<b>內心</b>，時干是他對外展現的<b>樣子</b>。'
        :'這局是<b>事局</b>——問的是一件事、一件事的走向。日干是這件事的<b>本質</b>，時干是它目前呈現出來的<b>表象</b>。';
      openingHtml=`<div class="ana-block">
        <div class="ana-h">第一步・先看這局是為誰起的</div>
        <div>這次問的是「<b>${T2(needKey)}</b>」。日干「${T2(dayStem)}」（${dStem?dStem.keyword:''}），時干「${T2(hourStem)}」（${hStem?hStem.keyword:''}）——
        <br>${juTypeNote}</div>
        <div style="margin-top:6px">${stemLocateLine('日',dayStem)}${stemLocateLine('時',hourStem)}</div>
      </div>`;
    }
    if(realZfGong||realZsGong){
      openingHtml+=`<div class="ana-block">
        <div>再看誰在主導、誰能出力：值符落在<b>${T2(realZfGong)}宮</b>，這局的話語權/主導力量在這裡；
        值使落在<b>${T2(realZsGong)}宮</b>，真正能使得上力、行動見效的位置在這裡。</div>
      </div>`;
    }

    // 第二步：有沒有踩雷
    let attentionHtml='';
    if(hitOnly.length){
      const tripleHit=['刑','墓','庚'].every(t=>hitOnly.some(x=>x.type===t));
      const kongGroups=groupList.filter(g=>g.type==='空');
      const otherGroups=groupList.filter(g=>g.type!=='空');
      // 空亡的方位跟著宮走、每個宮不一樣，不能合併方位，但補放的天干/字物意行是同一套(同個所求)，
      // 所以拆開處理：方位逐宮列出，補放說明只講一次，比逐宮重複整段乾淨。
      let kongHtml='';
      if(kongGroups.length){
        const allItems=kongGroups.flatMap(g=>g.items);
        const gongDirList=allItems.map(it=>`${T2(it.gong)}宮(${GUA_DIR[it.gong]||''})`).join('、');
        const first=allItems[0];
        const rule=MIEXIANG_RULE['空'];
        const c=first.cure;
        let bu='';
        if(c&&c.xiang){
          const x=c.xiang;
          const cvUnverified=c.verified===false?'（此為推導，未經視頻原文逐字驗證，僅供參考）':'';
          bu=`<div class="ana-step">補放：「${T2(x.stem)}」——${x.wu}，放${x.placement}${cvUnverified}</div>`;
        }
        kongHtml=`<div class="ana-item">
          <span class="lh-word lh-kong">空</span>
          ${gongDirList}皆空亡——${LIUHAI_MEANING['空']}
          <div class="ana-step">灭象：${rule?rule.action:''}</div>
          <div class="ana-step">布阵：每個空亡宮各自去自己對應的方位（如上列）補放，方位跟著宮走、不能合併成一個。</div>
          ${bu}
        </div>`;
      }
      attentionHtml=`<div class="ana-block">
        <div class="ana-h">第二步・有沒有踩到雷（只列命中本次號令的，按嚴重度由重到輕）</div>
        ${tripleHit?`<div class="ana-item"><b>刑、墓、庚同時命中</b>——正面主力（六儀）、奇兵奇謀（三奇）、主帥本身（甲）三個層級同時被打，是最重的疊加情況，建議優先全部處理完再看局勢。</div>`:''}
        ${otherGroups.map(grp=>{
          const first=grp.items[0];
          const gongList=grp.items.map(it=>T2(it.gong)).join('、');
          const headLine=grp.items.length>1?`${gongList}${grp.items.length}宮${GROUP_SUFFIX[grp.type]}`:first.label;
          return `<div class="ana-item">
            <span class="lh-word lh-${{刑:'xing',墓:'mu',庚:'geng',虎:'hu',迫:'po',空:'kong'}[grp.type]}">${grp.type}</span>
            ${headLine}——${LIUHAI_MEANING[grp.type]}${LIUHAI_DEEPER[grp.type]?`（${LIUHAI_DEEPER[grp.type]}）`:''}
            ${stepsHtml(first)}
          </div>`;
        }).join('')}
        ${kongHtml}
      </div>`;
    }else if(hitList.length){
      attentionHtml=`<div class="ana-block"><div class="ana-h">第二步・有沒有踩到雷</div><div>本局有六害，但都沒有命中本次號令保護的天干/宮位，屬於盤面背景，不是真正衝著這次問事來的，可以先不用特別處理。</div></div>`;
    }else{
      attentionHtml=`<div class="ana-block"><div class="ana-h">第二步・有沒有踩到雷</div><div>本局沒有檢測到刑墓庚虎迫空六害，盤面比較乾淨。</div></div>`;
    }

    // 第三步：整體判斷 (基於已驗證的嚴重度排序做的合成描述，非新方法論)
    const hasSevere=hitOnly.some(x=>x.severity<=3);
    let verdict;
    if(hitOnly.length===0) verdict='整體比較順，沒有命中號令的凶象，可以按原計劃推進。';
    else if(hasSevere) verdict='有明顯阻力（命中了刑/墓/庚其中之一），建議先把上面列的灭象/布阵做完，再看局勢有沒有轉順。';
    else verdict='有一些干擾（虎/迫/空層級），問題不算嚴重，但處理掉會更順。';

    return `<div class="analysis-card">
      ${openingHtml}
      ${attentionHtml}
      <div class="ana-block"><div class="ana-h">第三步・整體怎麼樣</div><div>${verdict}</div></div>
      <div class="ana-block"><div class="ana-h">第四步・排雷時要注意</div>
        <div>灭象、布阵一律「重天干、可忽略地干」，每個宮只看上面的天干；布阵時把化解用的天干/地支形象，按對你最有利的方式布入對應宮位（荀爽老師說的「利益最大原則」）。</div>
      </div>
    </div>`;
  })()}

  ${(function(){
    const anyHit=Object.keys(jixingHits).length||Object.keys(rumuHits).length||Object.keys(menpoHits).length
      ||Object.keys(gengHits).length||Object.keys(baihuHits).length||kongHitGongs.length;
    if(!anyHit)return '';

    const cureLine=(cure)=>{
      if(!cure)return '';
      const isKong=cure.hai==='空';
      const placeLine=cure.place
        ?(isKong
          ?`<div class="cure-line">→ 這個空亡宮自己對應的現實方位是<b>${cure.place}</b>，缺啥補啥就去這個方位補放</div>`
          :`<div class="cure-line">→ 無腦法：灭象後放到<b>${cure.place}</b>方位，兩個方位都可以</div>`)
        :'';
      const x=cure.xiang;
      if(!x)return placeLine;
      const unverified=cure.verified===false?'<span style="opacity:.6">（推導，未經視頻原文驗證，僅供參考）</span>':'';
      return placeLine+`<div class="cure-line">→ ${cure.place&&!isKong?'（進階）':''}${cure.method}：用「${x.stem}」，放${x.placement||'高處'}${unverified}<br>
        <span style="opacity:.85">字：${x.wu?x.wu:''}　字：${x.zi}</span><br>
        <span style="opacity:.85">意：${x.yi}　行：${x.xing}</span></div>`;
    };
    // 標記該條六害是否「命中號令」(日時/生年/意象/符使 之一): 命中者正常顯示, 未命中者弱化
    const hlTag=(isHit)=>isHit
      ?`<span class="hl-badge hl-hit">命中號令</span>`
      :`<span class="hl-badge hl-bg">背景凶象</span>`;
    const rowClass=(isHit)=>isHit?'':' style="opacity:.45"';

    let html='<div class="liuhai-card">';
    if(hasProtected){
      html+=`<div style="font-size:11px;opacity:.7;margin-bottom:8px">
        本次號令保護天干：${[...protectedStems].map(s=>T2(s)).join('、')}
        （日時/生年/意象/符使）——只有命中這些天干或其所在宮位，才是真正衝著這次問事來的凶象；其餘為盤面背景，僅供參考</div>`;
    }

    if(Object.keys(jixingHits).length){
      html+=`<div class="liuhai-sec">
        <div class="liuhai-title jx"><span class="dot"></span><span class="lh-word lh-xing">刑</span>（嚴重度最高，灭象：${MIEXIANG_RULE['刑'].action}，布阵：用合）</div>
        ${Object.entries(jixingHits).map(([g,st])=>{
          const isHit=protectedStems.has(st);
          const cure=getCureForJiXing(g,st);
          return `<div${rowClass(isHit)}>· ${T2(g)}宮　天干${T2(st)}擊刑 ${hlTag(isHit)}${cureLine(cure)}</div>`;
        }).join('')}
      </div>`;
    }

    if(Object.keys(rumuHits).length){
      html+=`<div class="liuhai-sec">
        <div class="liuhai-title rm"><span class="dot"></span><span class="lh-word lh-mu">墓</span>（灭象：${MIEXIANG_RULE['墓'].action}，布阵：用冲）</div>
        ${Object.entries(rumuHits).map(([g,st])=>{
          const isHit=protectedStems.has(st);
          const cure=getCureForRuMu(g,st);
          return `<div${rowClass(isHit)}>· ${T2(g)}宮　天干${T2(st)}入墓 ${hlTag(isHit)}${cureLine(cure)}</div>`;
        }).join('')}
      </div>`;
    }

    if(Object.keys(gengHits).length){
      html+=`<div class="liuhai-sec">
        <div class="liuhai-title mp"><span class="dot"></span><span class="lh-word lh-geng">庚</span>（灭象：${MIEXIANG_RULE['庚'].action}，布阵：無腦用乙）</div>
        ${Object.entries(gengHits).map(([g,st])=>{
          const isHit=protectedStems.has('庚');
          const cure=getCureForGengOrHu(g,'庚');
          return `<div${rowClass(isHit)}>· ${T2(g)}宮　天干庚 ${hlTag(isHit)}${cureLine(cure)}</div>`;
        }).join('')}
      </div>`;
    }

    if(Object.keys(baihuHits).length){
      html+=`<div class="liuhai-sec">
        <div class="liuhai-title mp"><span class="dot"></span><span class="lh-word lh-hu">虎</span>（白虎，布阵：無腦用乙；灭象動作暫沿用「刑」的通用規則，未經視頻明確驗證）</div>
        ${Object.entries(baihuHits).map(([g,gd])=>{
          const isHit=gongHitsProtected(g,sky,earth,protectedStems);
          const cure=getCureForGengOrHu(g,'虎');
          return `<div${rowClass(isHit)}>· ${T2(g)}宮　白虎 ${hlTag(isHit)}${cureLine(cure)}</div>`;
        }).join('')}
      </div>`;
    }

    if(Object.keys(menpoHits).length){
      html+=`<div class="liuhai-sec">
        <div class="liuhai-title po"><span class="dot"></span><span class="lh-word lh-po">迫</span>（門迫，壓力脅迫，門克宮；布阵：用合）</div>
        ${Object.entries(menpoHits).map(([g,dr])=>{
          const isHit=gongHitsProtected(g,sky,earth,protectedStems)||dr===zfzs.值使門宮?.[0];
          const cure=getCureForMenPo(g);
          const branchDetail=(cure&&cure.branchXiangs&&cure.branchXiangs.length)
            ?cure.branchXiangs.map(bx=>`「${bx.branch}」(${bx.zodiac})：${bx.wu}，放${bx.placement}`).join('；')
            :'';
          const cureHtml=cure?`<div class="cure-line">→ 用合：擺放「${cure.doorsText}」門象、對應地支「${cure.branchesText}」<br>
            <span style="opacity:.85">地支形象：${branchDetail}</span></div>`:'';
          return `<div${rowClass(isHit)}>· ${T2(g)}宮　${T2(dr)}門迫 ${hlTag(isHit)}${cureHtml}</div>`;
        }).join('')}
      </div>`;
    }

    if(kongHitGongs.length){
      html+=`<div class="liuhai-sec">
        <div class="liuhai-title kw"><span class="dot"></span><span class="lh-word lh-kong">空</span>（空亡，嚴重度最低，源自日時本身，布阵：缺啥補啥——目前所求「${needKey}」）</div>
        ${kongHitGongs.map(g=>{
          const cure=getCureForKongWang(g,needKey);
          return `<div>· ${T2(g)}宮　空亡（${kongGongMap[g].join('')}空）${hlTag(true)}${cureLine(cure)}</div>`;
        }).join('')}
      </div>`;
    }

    html+='</div>';
    return html;
  })()}

  <div class="info-card">
    <div class="info-title">吉凶速覽</div>
    ${GRID_ORDER.filter(g=>g!=='中').map(g=>{
      const dr=door[g]||'', st=star[g]||'', gd=god[g]||'';
      if(!dr&&!st)return '';
      return `<div class="info-row">
        <div class="info-k">${T2(GUA_NAME[g]||g)}</div>
        <div class="info-v">
          <span class="pill ${luckClass(T2(dr))}">${T2(dr)}</span>
          <span class="pill ${luckClass(T2(st))}">${T2(st)}</span>
          <span class="pill ${luckClass(T2(gd))}">${T2(gd)}</span>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  document.getElementById('result').innerHTML=html;

  /* 存入起局歷史記錄 (只存輸入條件與摘要, 不存完整盤面, 便於未來以最新算法回看) */
  const hitLabels=[];
  if(Object.keys(jixingHits).length)hitLabels.push('刑');
  if(Object.keys(rumuHits).length)hitLabels.push('墓');
  if(Object.keys(gengHits).length)hitLabels.push('庚');
  if(Object.keys(baihuHits).length)hitLabels.push('虎');
  if(Object.keys(menpoHits).length)hitLabels.push('迫');
  if(Object.keys(kongGongMap).filter(g=>g!=='中').length)hitLabels.push('空');
  pushHistoryRecord({
    id: Date.now(),
    dateStr: `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
    timeStr: `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`,
    needKey,
    yearsInput: yearsInput||'',
    juType,
    juLabel,
    gz,
    hitsSummary: hitLabels.length?`六害命中：${hitLabels.join('、')}`:'六害：無命中',
  });
}

/* ── 初始化 ── */
const init=()=>{
  if(typeof Solar==='undefined'||typeof QimenJS==='undefined'){setTimeout(init,50);return;}
  initT2();
  setNow();
};
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
</script>
